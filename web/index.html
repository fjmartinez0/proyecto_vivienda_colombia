<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Vivienda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--panel:#fff;--ink:#1b1d1f;--muted:#6b7075;--line:#e4e2dc;--soft:#f0efea;
--accent:#1f6f5c;--accent-soft:#e3f0ec;--warn:#b7791f;--warn-soft:#fbf1dc;--bad:#b23a3a;--bad-soft:#f7e1e1;
--good:#2f7d4a;--good-soft:#e2f2e7;--new:#1f4e8c;--new-soft:#e2eaf6;--used:#7d838a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa0a6;--line:#2c3035;--soft:#23272b;
--accent:#5fb89e;--accent-soft:#1d332d;--warn:#e0a84a;--warn-soft:#3a2f1a;--bad:#e07070;--bad-soft:#3a2020;
--good:#6cc48a;--good-soft:#1c3324;--new:#7aa8ea;--new-soft:#1d2a3d;--used:#8b9097}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:20px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;color:var(--muted);font:500 13px Inter;padding:6px 10px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.kpi b{display:block;font-size:17px;font-weight:700}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow:auto}
.view.active{display:block}
#v-mapa.active{display:grid;grid-template-columns:270px 1fr 0;overflow:hidden}
#v-mapa.active.open{grid-template-columns:270px 1fr 440px}
#map{height:100%;min-height:300px}
.filters{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
.filters h4{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.filters h4:first-child{margin-top:0}
.seg{display:flex;background:var(--soft);border-radius:7px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:5px;font:500 12.5px Inter;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px Inter;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.off{opacity:.45}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.legend{font-size:12px;color:var(--muted);line-height:1.9}
.legend .sw{display:inline-block;width:22px;height:12px;border-radius:6px;vertical-align:middle;margin-right:6px}
.detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
.dhead{display:flex;justify-content:space-between;gap:10px}
.dhead h2{margin:0;font-size:18px;letter-spacing:-.01em}
.x{border:0;background:var(--soft);color:var(--ink);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.b{font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.b.new{background:var(--new-soft);color:var(--new)}
.b.ok{background:var(--good-soft);color:var(--good)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}
.tipos{display:flex;gap:6px;margin:12px 0}
.tipos button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px;font:500 12px Inter;cursor:pointer;text-align:left}
.tipos button.on{border-color:var(--accent);background:var(--accent-soft)}
.tipos small{display:block;color:var(--muted);font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:8px;padding:9px 10px}
.stat span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:15px}
.stat.hl{background:var(--accent-soft)}
.stat.hl.hi{background:var(--bad-soft)}.stat.hl.mid{background:var(--warn-soft)}.stat.hl.lo{background:var(--good-soft)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.bars .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;border-radius:5px}
.flags{margin:0;padding:0;list-style:none}
.flags li{font-size:12.5px;padding:7px 9px;border-radius:6px;background:var(--warn-soft);color:var(--ink);margin-bottom:5px;border-left:3px solid var(--warn)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right}
.ctab{font-size:12px;overflow:auto}
.pos{color:var(--bad)}.neg{color:var(--good)}
.page{max-width:1200px;margin:0 auto;padding:20px 16px}
.page h2{margin:0 0 4px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 10px;font:13px Inter}
#tbl tr.ex td{opacity:.45}
#tbl th,#utbl th{cursor:pointer}
#utbl th.sorted::after{content:' ▾'}
.zres{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0}
.zres .card{padding:10px 12px;cursor:pointer}
.zres .card.on{outline:2px solid var(--accent)}
.zres b{font-size:15px}
#utbl a{color:inherit;text-decoration:underline dotted}
#tbl th.sorted::after{content:' ▾'}
.feedday{margin:18px 0 8px;font-weight:600}
.fitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.fitem .p{font-weight:700;text-align:right}
.fitem small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow small{display:block;color:var(--muted);font-size:12px}
.inp{display:flex;align-items:center;gap:6px}
.inp input{width:120px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 8px;font:13px 'JetBrains Mono',monospace;text-align:right}
.btn{border:0;background:var(--accent);color:#fff;font:600 13px Inter;padding:8px 14px;border-radius:7px;cursor:pointer}
.pinwrap{background:none;border:none}
.pin{display:flex;align-items:center;justify-content:center;height:24px;padding:0 9px;border-radius:12px;color:#fff;font:700 12px Inter;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;white-space:nowrap;position:relative;width:max-content;margin:0 auto;cursor:pointer}
.pin::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
.pin.hi{background:#b23a3a}.pin.mid{background:#c58a22}.pin.lo{background:#2f7d4a}.pin.na{background:#5a5f66}
.pin.sel{outline:3px solid #1f4e8c;outline-offset:1px}
/* pin de proyecto: nombre + valor, centrado sobre el punto aunque sea más ancho que el ícono */
.pinwrap .pin.proy{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;gap:6px}
.pin.proy .pn{font-weight:500;font-size:11px;opacity:.92;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pin.proy .pv{font-weight:700}
.ucl{width:30px;height:30px;border-radius:50%;background:rgba(90,95,102,.85);color:#fff;font:600 11.5px Inter;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dot.usel{width:16px;height:16px;border:3px solid #111;box-shadow:0 0 0 2px #fff}
.dot{width:10px;height:10px;border-radius:50%;background:#7d838a;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dot.ex{background:transparent;border:2px dashed #7d838a}
.leaflet-popup-content{font:12.5px Inter;margin:10px 12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:900px){
 #v-mapa.active,#v-mapa.active.open{display:block;overflow:auto}
 #map{height:55vh}
 .filters,.detail{border:0;border-top:1px solid var(--line)}
 .kpis{margin-left:0}
 .grid2{grid-template-columns:1fr}
 .bars .row{grid-template-columns:110px 1fr 64px}
}
#tbl a,.ctab a{color:inherit;text-decoration:underline dotted}
</style>
</head>

    <button data-v="feed">Detectados</button>
    <button data-v="sup">Supuestos</button>

  <div class="kpis" id="kpis"></div>
</header>
<main>
  <section class="view active" id="v-mapa">

  <section class="view" id="v-feed"></section>

</main>

  const o = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n;

  return o;

/* ---------- Generador de usados ficticios (determinístico) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(42);
function pip(pt, poly){const x=pt[1],y=pt[0];let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function diasAntes(k){const d=new Date(HOY+'T12:00:00');d.setDate(d.getDate()-k);return d.toISOString().slice(0,10)}
const FUENTES = ['Fincaraíz','Metrocuadrado','Ciencuadras'];

function genUsados(){
  const out=[]; let k=1;
  for (const z of ZONAS){
    const la=z.poly.map(p=>p[0]), ln=z.poly.map(p=>p[1]);
    const bb=[Math.min(...la),Math.max(...la),Math.min(...ln),Math.max(...ln)];
    for (let i=0;i<40;i++){
      let pt; do { pt=[bb[0]+rnd()*(bb[1]-bb[0]), bb[2]+rnd()*(bb[3]-bb[2])]; } while(!pip(pt,z.poly));
      const r=rnd(); const habs=r<.3?1:r<.8?2:3;
      const priv = habs===1?32+rnd()*18 : habs===2?48+rnd()*24 : 68+rnd()*30;
      const at=rnd(); const area_tipo = at<.7?'privada':at<.9?'construida':'desconocida';
      const area = Math.round(area_tipo==='construida'? priv/0.88 : priv);
      const antig = 1+Math.floor(Math.pow(rnd(),1.4)*34);
      const m2 = z.base_m2*1.22*(1-0.007*antig)*(0.9+0.2*rnd())*(habs===3?.96:1);
      const precio = Math.round(priv*m2/1e6)*1e6;
      const er=rnd(); const estrato = er<.85?z.estrato:(er<.93?z.estrato-1:z.estrato+1);
      const ascensor = antig>20 ? rnd()<.5 : rnd()<.93;
      const pr=rnd(); const parq = habs===1?(pr<.45?0:1):habs===2?(pr<.12?0:1):(pr<.55?1:2);
      const admin = Math.round(priv*z.admin_m2*(antig<10?1.15:antig<20?1:.85)*(0.85+.3*rnd())/1000)*1000;
      let rc; if(antig>15){rc=rnd()<.7?'prohibida':'desconocida'} else {const q=rnd(); rc=q<.35?'permitida':q<.8?'desconocida':'prohibida'}
      const nf=1+Math.floor(Math.pow(rnd(),2)*3), f0=Math.floor(rnd()*3);
      const fuentes=[...Array(nf)].map((_,j)=>FUENTES[(f0+j)%3]);
      out.push({id:'U'+String(k++).padStart(3,'0'), zona:z.id, ciudad:z.ciudad, lat:pt[0], lng:pt[1], estrato, habs, banos:habs===1?1:2,
        area, area_tipo, parq, precio, admin, ascensor, antiguedad:antig, piso:2+Math.floor(rnd()*13), renta_corta:rc, fuentes,
        detectado: diasAntes(Math.floor(Math.pow(rnd(),1.6)*30))});
    }
  }
  return out;
}

/* ---------- Motor de comparación ---------- */
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const areaPriv = (a, tipo) => tipo==='construida' ? a*PARAMS.factor_privada : a;
// área privada real (brochure) si existe; si no, estimada desde la construida
const apNuevo = (p, t) => t.area_privada || areaPriv(t.area, p.area_tipo);
function mesesA(e){if(!e)return 0;const [y,m]=e.split('-').map(Number);return Math.max(0,(y-2026)*12+(m-10))}

function ajusteNuevo(p,t){
  const z=Z[p.zona], ap=apNuevo(p,t), m=mesesA(p.entrega), r=PARAMS.tasa_ea;
  const acab = p.acabados==='Obra gris' ? PARAMS.acabados_m2*ap : 0;
  const cuota=t.precio*PARAMS.cuota_ini, saldo=t.precio-cuota;
  const pv = cuota*Math.pow(1+r,-m/24) + (saldo+acab)*Math.pow(1+r,-m/12);
  const rentaPerd = PARAMS.renta_perdida ? z.arriendo_m2*ap*m : 0;
  const efectivo = pv + rentaPerd;
  return {ap, m, acab, pv, rentaPerd, efectivo, m2:efectivo/ap, m2_lista:t.precio/ap, total:t.precio+acab};
}
function ajusteUsado(u){
  const ap=areaPriv(u.area,u.area_tipo), neto=u.precio*(1-PARAMS.desc_neg);

function elegible(u){return u.ascensor===true && u.precio<=PARAMS.precio_max}
const distM=(a,b,c,d)=>6371000*Math.hypot((c-a)*Math.PI/180,(d-b)*Math.PI/180*Math.cos(a*Math.PI/180));
// En datos reales el estrato solo filtra si el proyecto lo tiene confirmado: el "típico" de la zona es un
// supuesto y en zonas mixtas (Calle 72: estratos 4, 5 y 6) dejaba sin comparables a casi todos.
function filtroComp(p,t,o){
  const ap=apNuevo(p,t), est = MODO==='real' ? p.estrato : (p.estrato || Z[p.zona].estrato), ciudad=Z[p.zona].ciudad;
  return (o.radio ? USADOS_TODOS : USADOS).filter(u => (o.radio ? ((u.ciudad||Z[u.zona]?.ciudad)===ciudad && distM(p.lat,p.lng,u.lat,u.lng)<=o.radio) : u.zona===p.zona)
    && (est==null || u.estrato==null || Math.abs(u.estrato-est)<=(o.estr||0)) && u.habs===t.habs && elegible(u)
    && (u.antiguedad==null || u.antiguedad<=o.antig) && Math.abs(areaPriv(u.area,u.area_tipo)/ap-1)<=o.tol
    && (!PARAMS.exigir_parq || u.parq===t.parq));
}
// Comparables SOLO de la misma zona: las zonas son submercados (Morato no se compara con Pasadena).
// Paso 0: criterios estrictos. Paso 1 (si hay < min_comps): misma zona con área, antigüedad y estrato ampliados.
// Con menos de 3 al final no se calcula sobreprecio (s/c).
function comparables(p,t){
  const pasos=[
    {nivel:0, tol:PARAMS.tol_area, antig:PARAMS.max_antig, radio:0, desc:'misma zona'},
    {nivel:1, tol:PARAMS.tol_area_amplia, antig:PARAMS.max_antig_amplia, radio:0, estr:1,
     desc:`misma zona con área ±${Math.round(PARAMS.tol_area_amplia*100)} %, antigüedad ≤ ${PARAMS.max_antig_amplia} años y estrato ±1`}];
  let l;
  for(const o of pasos){ l=filtroComp(p,t,o); l.nivel=o.nivel; l.desc=o.desc; if(l.length>=PARAMS.min_comps) break; }
  return l;
}
// Referencia (solo informativa): usados parecidos FUERA de la zona, a ≤ radio_amplio del proyecto.
function referenciaEntorno(p,t){
  return filtroComp(p,t,{tol:PARAMS.tol_area_amplia, antig:PARAMS.max_antig_amplia, radio:PARAMS.radio_amplio, estr:1})
    .filter(u=>u.zona!==p.zona);

function rentab(precio, ap, habs, z, adminMes, rc){
  const largo = z.arriendo_m2*ap;

  const cortoN = cortoB*(1-PARAMS.com_plataforma-PARAMS.gestion) - PARAMS.servicios_mes;

  return {largo, cortoN, yL:(largo-adminMes-predialMes)*12/precio, yC: rc==='prohibida'?null:(cortoN-adminMes-predialMes)*12/precio};
}

let baseIdx = 0, baseLayer = null, baseErr = 0;
function setBase(i){
  if(baseLayer) map.removeLayer(baseLayer);
  baseIdx = i; baseErr = 0;
  baseLayer = L.tileLayer(BASEMAPS[i].url, BASEMAPS[i].opt)
    .on('tileerror', () => { if(++baseErr > 3 && baseIdx < BASEMAPS.length-1) setBase(baseIdx+1); })
    .addTo(map);
  baseLayer.bringToBack();
}
setBase(0);
const zoneLayer=L.layerGroup().addTo(map), projLayer=L.layerGroup().addTo(map), compLayer=L.layerGroup().addTo(map);
// grupos en gris neutro: el verde/rojo queda reservado para el precio de cada punto
const usedLayer=L.markerClusterGroup({maxClusterRadius:40,showCoverageOnHover:false,disableClusteringAtZoom:16,
  iconCreateFunction:c=>L.divIcon({className:'pinwrap',html:`<div class="ucl">${c.getChildCount()}</div>`,iconSize:[30,30]})});
function dibujarZonas(){zoneLayer.clearLayers();ZONAS.forEach(z => L.polygon(z.poly,{color:z.color,weight:1.2,opacity:.7,fillOpacity:.04,dashArray:'4 4'}).bindTooltip(`<b>${z.nombre}</b><br>${z.desc}`,{sticky:true}).addTo(zoneLayer));}

function fitCiudad(){const pts=ZONAS.filter(z=>z.ciudad===state.ciudad).flatMap(z=>z.poly);map.fitBounds(pts,{padding:[30,30]})}

function renderMapa(){
  projLayer.clearLayers(); usedLayer.clearLayers(); compLayer.clearLayers();
  if(state.capa!=='usados') proyFiltrados().forEach(p=>{
    const I=infoProyecto(p), pr=I.prima, c=clsPrima(pr);
    const etiqueta = pr!==null ? (I.nivel>0?'≈':'')+pct(pr) : desde(p)===null ? 's/precio' : USADOS.length ? 's/c' : fM(desde(p));
    const motivo = pr!==null ? (I.nivel>0?'Sobreprecio vs. usados de la zona con criterios ampliados (área, antigüedad, estrato)':`Sobreprecio real vs. usados comparables de la zona`)
      : desde(p)===null ? 'Precio no publicado: no se puede comparar'
      : USADOS.length ? `Sin comparables suficientes en la zona (${I.maxComps} de 3 mínimos)${I.refPrima!==null?`. Referencia fuera de la zona: ${pct(I.refPrima)}`:''}` : '';
    const estadoTxt = p.estado && p.estado!=='Sin dato' ? p.estado : `Entrega ${p.entrega||'s/d'}`;
    const icon=L.divIcon({className:'pinwrap',html:`<div class="pin proy ${c} ${state.sel===p.id?'sel':''}"><span class="pn">${p.nombre}</span><span class="pv">${etiqueta}</span></div>`,iconSize:[80,30],iconAnchor:[40,34]});
    L.marker([p.lat,p.lng],{icon,zIndexOffset:1000}).on('click',()=>selProyecto(p.id))
      .bindTooltip(`<b>${p.nombre}</b><br>${estadoTxt} · ${desde(p)?'desde '+fM(desde(p)):'precio no publicado'}${motivo?`<br><span style="color:#666">${etiqueta} = ${motivo}</span>`:''}`,{direction:'top',offset:[0,-30]}).addTo(projLayer);
  });
  if(state.capa!=='nuevos'){
    const us=usadosFiltrados(), medZ={};
    Object.keys(Z).forEach(z=>medZ[z]=median(us.filter(u=>u.zona===z).map(u=>ajusteUsado(u).m2_lista)));
    us.forEach(u=>{
      const a=ajusteUsado(u), dv=medZ[u.zona]?a.m2_lista/medZ[u.zona]-1:0;
      const col=dv<=-0.10?'#2f7d4a':dv>=0.10?'#b23a3a':'#7d838a';
      const selU=state.selU===u.id;
      L.marker([u.lat,u.lng],{icon:L.divIcon({className:'pinwrap',html:`<div class="dot ${selU?'usel':''}" style="background:${col}"></div>`,iconSize:selU?[18,18]:[10,10]}),zIndexOffset:selU?900:0})
        .on('click',()=>selUsado(u.id))
        .bindTooltip(`<b>${nombreUsado(u)} · ${u.area} m²</b>${u.barrio?' · '+u.barrio:''}<br>${fM(u.precio)} · ${fM1(a.m2_lista)}/m² <small>(${pct(dv)} vs. zona)</small><br><small class="muted">clic para ver detalle</small>`,{direction:'top'})
        .addTo(usedLayer);
    });
    if(!map.hasLayer(usedLayer)) usedLayer.addTo(map);
  } else if(map.hasLayer(usedLayer)) map.removeLayer(usedLayer);

  const p=PROYECTOS.find(x=>x.id===state.sel);
  if(p){
    analisis(p,state.tip).comps.forEach(({u,a})=>{
      L.polyline([[p.lat,p.lng],[u.lat,u.lng]],{color:'#1f4e8c',weight:1.2,dashArray:'3 4',opacity:.7}).addTo(compLayer);
      L.circleMarker([u.lat,u.lng],{radius:6,color:'#fff',weight:2,fillColor:'#1f4e8c',fillOpacity:1})
        .bindTooltip(`${u.id} · ${fM1(a.m2)}/m² aj. · ${u.zona?'clic para ver':'fuera de zonas (entorno)'}`)
        .on('click',()=>{ if(u.zona) selUsado(u.id); else if(u.url) window.open(u.url,'_blank','noopener'); }).addTo(compLayer);
    });
  }
}

function tog(set,v){set.has(v)?set.delete(v):set.add(v)}

/* ---------- Panel de detalle / comparador ---------- */
function selProyecto(id){state.sel=id;state.selU=null;state.tip=0;renderDetalle();renderMapa();setTimeout(()=>map.invalidateSize(),50)}
function selUsado(id){state.selU=id;state.sel=null;renderDetalle();renderMapa();setTimeout(()=>map.invalidateSize(),50)}

function renderDetalle(){
  const v=$('#v-mapa'), el=$('#detail'), p=PROYECTOS.find(x=>x.id===state.sel);
  const uSel=!p && state.selU ? USADOS.find(x=>x.id===state.selU) : null;
  if(uSel){ v.classList.add('open'); renderDetalleUsado(uSel, el); return; }
  if(!p){v.classList.remove('open');el.innerHTML='';setTimeout(()=>map.invalidateSize(),50);return}
  v.classList.add('open');
  const z=Z[p.zona], A=analisis(p,state.tip), n=A.n, t=A.t;
  const flags=[];
  if(MODO==='real'){
    if(p.notas) flags.push(`Nota: ${p.notas}`);
    if(!t.precio) flags.push('Precio no publicado: no se puede calcular el sobreprecio.');
    if(p.ubicacion_agregador) flags.push(`Ubicación tomada de la dirección publicada por el agregador${p.direccion?` (${p.direccion})`:''}: <b>pendiente de confirmar</b> con una fuente oficial.`);
    else if(p.precision==='baja') flags.push('Ubicación <b>no verificada</b>: ni la dirección en la fuente ni la calle en OpenStreetMap coincidieron.');
    else if(p.precision==='media') flags.push('Ubicación con una sola verificación (dirección oficial, calle en OpenStreetMap o enlace de mapa).');
    if(p.zona_nota) flags.push(`El punto del proyecto cae fuera del polígono (${p.zona_nota}): se asigna a esta zona por cercanía.`);

    if(!p.admin_m2) flags.push('Administración sin dato: la rentabilidad no la descuenta.');
    if(p.ascensor===false) flags.push('<b>Sin ascensor</b> según la fuente: no cumple tu regla.');
    else if(p.ascensor==null) flags.push('Ascensor sin confirmar.');
  }
  if(t.area_privada) flags.push(`Área privada <b>${t.area_privada} m²</b> tomada del brochure del proyecto.`);
  else if(p.area_tipo==='construida') flags.push(`Área anunciada es <b>construida</b>: privada estimada × ${PARAMS.factor_privada} = ${n.ap.toFixed(1)} m².`);
  if(p.acabados==='Obra gris') flags.push(`Obra gris: se suman ${fK(PARAMS.acabados_m2)}/m² de acabados (${fM(n.acab)}).`);
  if(p.renta_corta==='desconocida') flags.push('Renta corta sin confirmar: revisar el reglamento de propiedad horizontal.');
  if(n.m>0) flags.push(`Entrega en ${n.m} meses: precio llevado a valor presente${PARAMS.renta_perdida?` + ${fM(n.rentaPerd)} de arriendo no percibido`:''}.`);
  if(A.nivel>0 && A.comps.length) flags.push(`Pocos usados parecidos en la zona: comparables con criterios ampliados (<b>${A.desc}</b>).`);
  if(A.comps.length<3) flags.push(`Solo ${A.comps.length} comparable(s) en la zona aun ampliando criterios: no alcanza para calcular sobreprecio. En la zona casi no hay usados de este tamaño con ascensor.`);
  if(A.ref.n) flags.push(`Referencia fuera de la zona (no entra en el cálculo): ${A.ref.n} usados parecidos a ≤ ${PARAMS.radio_amplio} m en otras zonas, mediana ${fM1(A.ref.med)}/m² ajustado${A.ref.prima!==null?` → este proyecto estaría ${pct(A.ref.prima)} frente a ellos`:''}.`);
  const nf=A.comps.filter(c=>c.u.area_tipo!=='privada').length;
  if(nf) flags.push(`${nf} de ${A.comps.length} comparables con área no confirmada como privada.`);

  const adminN=p.admin_m2?p.admin_m2*n.ap:null, rN=rentab(n.total,n.ap,t.habs,z,adminN||0,p.renta_corta);
  const rC=A.comps.map(c=>rentab(c.a.neto,c.a.ap,c.u.habs,z,c.u.admin,c.u.renta_corta));
  const yLc=median(rC.map(r=>r.yL)), yCc=median(rC.map(r=>r.yC).filter(x=>x!==null));
  const mx=Math.max(n.m2_lista,n.m2,A.medL||0,A.med||0);
  const bar=(l,v,c)=>`<div class="row"><span>${l}</span><div class="track"><div class="fill" style="width:${v?v/mx*100:0}%;background:${c}"></div></div><span class="mono" style="text-align:right">${v?fM1(v):'—'}</span></div>`;

  el.innerHTML=`
  <div class="dhead"><div><h2>${p.nombre}</h2><div class="muted">${p.constructora} · ${z.nombre}${p.direccion?` · ${p.direccion}`:""}</div>${p.url?`<a href="${p.url}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">Ver ficha ↗</a>`:""}${p.brochure?` · <a href="${p.brochure}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">Brochure ↗</a>`:""}</div><button class="x" id="cls">×</button></div>
  <div class="meta"><span class="b new">${p.estado==="Sin dato"?"Estado s/d":p.estado}</span><span class="b">Entrega ${p.entrega||"s/d"}</span><span class="b">Estrato ${MODO==="real"?(p.estrato??"s/d"):z.estrato}</span><span class="b">${p.acabados==="Sin dato"?"Acabados s/d":p.acabados}</span><span class="b">Ascensor ${MODO==="real"?(p.ascensor===true?"✓":p.ascensor===false?"✗":"¿?"):"✓"}</span>${rcBadge(p.renta_corta)}<span class="b">Fuente: ${p.fuente}</span>${(p.categorias||[]).filter(c=>c!=='Renta Corta').map(c=>`<span class="b">${c}</span>`).join('')}</div>
  <div class="tipos">${p.tipologias.map((x,i)=>`<button data-t="${i}" class="${i===state.tip?'on':''}"><b>${x.habs} hab · ${x.area} m²${x.area_privada?' ✓':areaFlag(p.area_tipo)}</b><small>${fM(x.precio)} · ${x.parq} parq.</small></button>`).join('')}</div>
  <div class="grid3">
    <div class="stat"><span>Precio total</span><b>${t.precio?fM(n.total):"Sin precio"}</b></div>
    <div class="stat"><span>Área privada</span><b>${n.ap.toFixed(1)} m²</b></div>
    <div class="stat"><span>Admin. estimada</span><b>${adminN?fK(adminN):'Sin dato'}</b></div>
    <div class="stat" title="Comparando precios de anuncio tal cual, sin ajustes"><span>Sobreprecio aparente</span><b class="${A.primaL>0?'pos':'neg'}">${pct(A.primaL)}</b></div>
    <div class="stat hl ${clsPrima(A.prima)}" style="grid-column:span 2"><span>Sobreprecio real vs. usados</span><b>${pct(A.prima)}</b> <small class="muted">· ${A.comps.length} comparables${A.nivel>0?' (ampliados)':''}</small></div>
  </div>
  <p class="muted" style="font-size:11.5px;margin:8px 0 0"><b>Aparente:</b> precio de anuncio vs. precio de anuncio. <b>Real:</b> el nuevo se trae a valor presente y se le suman acabados y el arriendo que dejas de recibir durante la obra; al usado se le descuenta la negociación esperada.</p>
  <h3>Precio por m² de área privada</h3>
  <div class="bars">
    ${bar('Nuevo · lista',n.m2_lista,'#7aa8ea')}
    ${bar('Nuevo · efectivo',n.m2,'#1f4e8c')}
    ${bar('Usados · lista (med.)',A.medL,'#b9bdc2')}
    ${bar('Usados · ajustado (med.)',A.med,'#7d838a')}
  </div>
  ${flags.length?`<h3>Banderas</h3><ul class="flags">${flags.map(f=>`<li>${f}</li>`).join('')}</ul>`:''}
  <h3>Rentabilidad neta estimada</h3>
  <table class="ctab"><thead><tr><th></th><th class="n">Este proyecto</th><th class="n">Usados (med.)</th></tr></thead><tbody>
    <tr><td>Arriendo largo / mes</td><td class="n">${fK(rN.largo)}</td><td class="n">${rC.length?fK(median(rC.map(r=>r.largo))):'—'}</td></tr>
    <tr><td>Yield neto largo</td><td class="n"><b>${pct(rN.yL,false)}</b></td><td class="n"><b>${pct(yLc,false)}</b></td></tr>
    <tr><td>Renta corta neta / mes</td><td class="n">${p.renta_corta==='prohibida'?'No permitida':fK(rN.cortoN)}</td><td class="n">${rC.length?fK(median(rC.map(r=>r.cortoN))):'—'}</td></tr>
    <tr><td>Yield neto corto</td><td class="n"><b>${pct(rN.yC,false)}</b></td><td class="n"><b>${pct(yCc,false)}</b> <small class="muted">(${rC.filter(r=>r.yC!==null).length} habilitados)</small></td></tr>
  </tbody></table>
  <p class="muted" style="font-size:11.5px">${MODO==="real"?"<b>Arriendo y ADR por zona aún son supuestos, no datos de mercado.</b> ":""}Netos de administración y predial. Renta corta: ADR ${fK(z.adr[Math.min(t.habs,3)])} × ocupación ${(z.ocup*100).toFixed(0)}% − plataforma, gestión y servicios.</p>
  <h3>Comparables usados (${A.comps.length})</h3>
  ${A.comps.length?`<div class="ctab"><table><thead><tr><th>ID</th><th class="n">Área</th><th class="n">Antig.</th><th class="n">Parq</th><th class="n">Adm</th><th class="n">$/m² aj.</th><th class="n">Sobreprecio</th><th>RC</th><th class="n">Fuentes</th></tr></thead><tbody>
    ${A.comps.sort((a,b)=>a.a.m2-b.a.m2).map(({u,a})=>`<tr><td class="mono">${u.url?`<a href="${u.url}" target="_blank" rel="noopener">${u.id}</a>`:u.id}</td><td class="n">${a.ap.toFixed(0)}${areaFlag(u.area_tipo)}</td><td class="n">${u.antiguedad??'?'}</td><td class="n">${u.parq??'?'}${u.parq!=null&&u.parq!==t.parq?'*':''}</td><td class="n">${fK(u.admin)}</td><td class="n mono">${fM1(a.m2)}</td><td class="n ${n.m2/a.m2-1>0?'pos':'neg'}">${pct(n.m2/a.m2-1)}</td><td>${u.renta_corta==='permitida'?'✓':u.renta_corta==='prohibida'?'✗':'?'}</td><td class="n" title="${u.fuentes.join(', ')}">${u.fuentes.length}</td></tr>`).join('')}

  :`<div class="empty">${USADOS.length?"Sin comparables con los criterios actuales. Ajusta tolerancia de área o antigüedad en Supuestos.":"Los usados comparables se agregan en el siguiente módulo."}</div>`}`;
  $('#cls').onclick=()=>{state.sel=null;renderDetalle();renderMapa()};
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{state.tip=+b.dataset.t;renderDetalle();renderMapa()});
}

/* ---------- Panel de un usado ---------- */
function diasDesde(f){ if(!f) return null; return Math.round((new Date(HOY+'T12:00:00')-new Date(f.slice(0,10)+'T12:00:00'))/864e5); }
function similaresUsado(u){
  const ap=areaPriv(u.area,u.area_tipo);
  return USADOS.filter(x=>x.id!==u.id && x.zona===u.zona && x.habs===u.habs && x.ascensor===true
    && Math.abs(areaPriv(x.area,x.area_tipo)/ap-1)<=PARAMS.tol_area);
}
function renderDetalleUsado(u, el){
  const z=Z[u.zona], a=ajusteUsado(u);
  const sim=similaresUsado(u), simM2=sim.map(x=>ajusteUsado(x).m2_lista);
  const zonaM2=USADOS.filter(x=>x.zona===u.zona && x.ascensor===true).map(x=>ajusteUsado(x).m2_lista);
  const medSim=median(simM2), medZona=median(zonaM2);
  const masCaros = simM2.length ? simM2.filter(v=>v>a.m2_lista).length/simM2.length : null;
  const admM2 = u.admin? u.admin/a.ap : null;
  const admZona = median(USADOS.filter(x=>x.zona===u.zona && x.admin).map(x=>x.admin/areaPriv(x.area,x.area_tipo)));
  const dPub=diasDesde(u.creado_portal), dRadar=diasDesde(u.detectado);

/* ---------- Tabla ---------- */
function filasTabla(){
  const rows=[];
  PROYECTOS.filter(p=>p.ciudad===state.ciudad).forEach(p=>p.tipologias.forEach((t,i)=>{
    const n=ajusteNuevo(p,t);
    rows.push({tipo:'Nuevo',id:p.id+'-'+(i+1),nombre:p.nombre,zona:Z[p.zona].nombre,estrato:Z[p.zona].estrato,habs:t.habs,area:t.area,area_tipo:t.area_privada?'privada':p.area_tipo,ap:n.ap,parq:t.parq,ascensor:true,
      admin:p.admin_m2?p.admin_m2*n.ap:null,precio:t.precio,m2:n.m2_lista,edad:'Entrega '+p.entrega,rc:p.renta_corta,fuentes:[p.fuente],detectado:p.detectado,excl:t.precio>PARAMS.precio_max?'Sobre tope':''});
  }));
  USADOS.filter(u=>u.ciudad===state.ciudad).forEach(u=>{
    const a=ajusteUsado(u);
    rows.push({tipo:'Usado',id:u.id,url:u.url,nombre:`${nombreUsado(u)}${u.piso?' · piso '+u.piso:''}${u.barrio?' · '+u.barrio:''}`,zona:Z[u.zona].nombre,estrato:u.estrato,habs:u.habs,area:u.area,area_tipo:u.area_tipo,ap:a.ap,parq:u.parq,ascensor:u.ascensor,
      admin:u.admin,precio:u.precio,m2:a.m2_lista,edad:antig(u),rc:u.renta_corta,fuentes:u.fuentes,detectado:u.detectado,excl:u.ascensor===false?'Sin ascensor':u.ascensor!==true?'Ascensor sin confirmar':u.precio>PARAMS.precio_max?'Sobre tope':''});
  });
  return rows;
}
const COLS=[['tipo','Tipo'],['id','ID'],['nombre','Inmueble'],['zona','Zona'],['estrato','Estr.',1],['habs','Hab',1],['ap','Á. priv',1],['parq','Parq',1],['admin','Admin',1],['adm2','Adm/m²',1],['precio','Precio',1],['m2','$/m²',1],['edad','Antig./Entrega'],['rc','R. corta'],['fuentes','Fuentes',1],['detectado','Detectado']];
function renderTabla(){
  let rows=filasTabla().map(r=>({...r,adm2:r.admin?r.admin/r.ap:null}));
  const ex=rows.filter(r=>r.excl).length;
  if(!state.excl) rows=rows.filter(r=>!r.excl);
  if(state.tipo!=='Todos') rows=rows.filter(r=>r.tipo===state.tipo);
  if(state.q){const q=state.q.toLowerCase();rows=rows.filter(r=>(r.nombre+r.zona+r.id).toLowerCase().includes(q))}
  const {k,d}=state.sort; rows.sort((a,b)=>{const x=k==='fuentes'?a.fuentes.length:a[k], y=k==='fuentes'?b.fuentes.length:b[k]; return (x>y?1:x<y?-1:0)*d});
  $('#v-tabla').innerHTML=`<div class="page"><h2>Inventario · ${state.ciudad}</h2>
  <p class="muted">Una fila por tipología (nuevos) o por anuncio deduplicado (usados). ${ex} excluidos por reglas duras.</p>

   <span class="muted">${rows.length} filas</span></div>
  <div class="card" style="padding:0;overflow:auto;max-height:70vh"><table id="tbl"><thead><tr>${COLS.map(([c,l,num])=>`<th data-k="${c}" class="${num?'n':''} ${state.sort.k===c?'sorted':''}">${l}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.excl?'ex':''}" title="${r.excl}">
   <td><span class="b ${r.tipo==='Nuevo'?'new':''}">${r.tipo}</span></td><td class="mono">${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.id}</a>`:r.id}</td><td>${r.nombre}${r.excl?` <span class="b bad">${r.excl}</span>`:''}</td><td>${r.zona}</td>
   <td class="n">${r.estrato??'?'}</td><td class="n">${r.habs??'?'}</td><td class="n">${r.ap.toFixed(0)}${areaFlag(r.area_tipo)}</td><td class="n">${r.parq??'?'}</td>
   <td class="n">${fK(r.admin)}</td><td class="n">${fK(r.adm2)}</td><td class="n">${fM(r.precio)}</td><td class="n mono">${fM1(r.m2)}</td><td>${r.edad}</td>
   <td>${r.rc==='permitida'?'✓':r.rc==='prohibida'?'✗':'?'}</td><td class="n" title="${r.fuentes.join(', ')}">${r.fuentes.length}</td><td class="mono">${r.detectado}</td></tr>`).join('')}
  </tbody></table></div></div>`;
  $('#q').oninput=e=>{state.q=e.target.value;renderTabla();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  $('#tp').onchange=e=>{state.tipo=e.target.value;renderTabla()};
  $('#ex').onchange=e=>{state.excl=e.target.checked;renderTabla()};
  $('#tbl').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;state.sort={k,d:state.sort.k===k?-state.sort.d:-1};renderTabla()});
}

function usadosVista(){
  return USADOS.filter(u => u.ciudad===state.ciudad).map(u => {
    const a = ajusteUsado(u);
    const cambio = u.precio_inicial && u.precio_inicial!==u.precio ? u.precio/u.precio_inicial-1 : null;
    const asc = u.ascensor===true ? ((u.ascensor_fuente||'').startsWith('probable')?'probable':'sí') : u.ascensor===false?'no':'¿?';
    return {...u, ap:a.ap, m2:a.m2_lista, adm2:u.admin? u.admin/a.ap : null, cambio, asc,
            zonaN: Z[u.zona].nombre};
  });
}
function filtrarUsados(rows){

    && (!US.q || ((r.barrio||'')+' '+r.zonaN+' '+r.id).toLowerCase().includes(US.q.toLowerCase())));
}

  const rer = () => renderUsados();
  el.querySelectorAll('.zres .card').forEach(c=>c.onclick=()=>{US.zona = US.zona===c.dataset.z?'Todas':c.dataset.z; rer();});
  el.querySelectorAll('#utbl tbody tr[data-id]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('a')) return;
    if(state.capa==='nuevos'){state.capa='usados';renderFiltros();}
    $('#tabs button[data-v="mapa"]').click(); selUsado(tr.dataset.id);
    const u=USADOS.find(x=>x.id===tr.dataset.id); if(u) setTimeout(()=>map.setView([u.lat,u.lng],16),80); });
  $('#uz').onchange=e=>{US.zona=e.target.value;rer()};
  $('#uh').onchange=e=>{US.habs=e.target.value;rer()};
  $('#ua').onchange=e=>{US.asc=e.target.value;rer()};
  $('#up').onchange=e=>{US.precioMax=(+e.target.value||600)*1e6;rer()};
  $('#uq').oninput=e=>{US.q=e.target.value;rer();const i=$('#uq');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  el.querySelectorAll('#utbl th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;US.sort={k,d:US.sort.k===k?-US.sort.d:1};rer()});
  $('#ucsv').onclick=()=>{
    const cols=['id','zonaN','barrio','tipo','habs','banos','area','area_tipo','ap','precio','m2','admin','adm2','estrato','piso','antiguedad_texto','parq','asc','cambio','detectado','url'];
    const esc=v=>v==null?'':/[",;\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
    const txt=[cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(typeof r[c]==='number'?Math.round(r[c]*100)/100:r[c])).join(','))).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));
    a.download=`usados_${state.ciudad}_${HOY}.csv`; a.click();
  };
}

/* ---------- Feed de detectados ---------- */
function renderFeed(){
  const lim=diasAntes(6), items=[];
  PROYECTOS.filter(p=>p.detectado>=lim).forEach(p=>items.push({d:p.detectado,html:`<span class="b new">PROYECTO NUEVO</span>
    <div><b>${p.nombre}</b> · ${Z[p.zona].nombre} <small>(${p.ciudad})</small><br><small>${p.estado} · entrega ${p.entrega||'s/d'} · ${p.tipologias.map(t=>t.habs+'h '+t.area+'m²').join(' / ')} · ${p.acabados}${p.area_tipo==='construida'?' · ⚠ área construida':''} · fuente: ${p.fuente}</small></div>
    <div class="p">${desde(p)?'desde '+fM(desde(p)):'sin precio'}<br><small>sobreprecio ${pct(primaProyecto(p))}</small></div>`}));
  USADOS.filter(u=>u.detectado>=lim && elegible(u)).forEach(u=>{const a=ajusteUsado(u);items.push({d:u.detectado,html:`<span class="b">USADO</span>
    <div><b>${nombreUsado(u)} · ${a.ap.toFixed(0)} m²${areaFlag(u.area_tipo)}</b> · ${Z[u.zona].nombre} <small>(${u.ciudad})</small><br><small>Estrato ${u.estrato??'?'} · ${antig(u)} · ${u.parq??'?'} parq · adm ${fK(u.admin)} · ${u.fuentes.length>1?`visto en ${u.fuentes.join(' + ')} (deduplicado)`:u.fuentes[0]}</small></div>
    <div class="p">${fM(u.precio)}<br><small>${fM1(a.m2_lista)}/m²</small></div>`})});
  const byDay={}; items.forEach(i=>(byDay[i.d]=byDay[i.d]||[]).push(i.html));
  const hoyP=PROYECTOS.filter(p=>p.detectado===HOY).length, hoyU=USADOS.filter(u=>u.detectado===HOY&&elegible(u)).length;
  $('#v-feed').innerHTML=`<div class="page"><h2>Detectados · últimos 7 días</h2>
   <p class="muted">Hoy: <b>${hoyP}</b> proyectos nuevos y <b>${hoyU}</b> usados que cumplen las reglas duras (ascensor, ≤ ${fM(PARAMS.precio_max)}). Ambas ciudades.</p>
   ${Object.keys(byDay).sort().reverse().map(d=>`<div class="feedday">${d===HOY?'Hoy · ':''}${new Date(d+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})} <span class="muted">· ${byDay[d].length}</span></div>${byDay[d].map(h=>`<div class="fitem">${h}</div>`).join('')}`).join('')}</div>`;
}

/* ---------- Supuestos ---------- */
function renderSup(){
  const rows=PARAM_META.map(([k,l,t,h])=>{
    const inp = t==='bool' ? `<input type="checkbox" data-k="${k}" data-t="bool" ${PARAMS[k]?'checked':''}>`
      : `<div class="inp"><input type="number" data-k="${k}" data-t="${t}" value="${t==='pct'?+(PARAMS[k]*100).toFixed(2):PARAMS[k]}" step="${t==='pct'?0.5:t==='cop'?10000:1}"><span class="muted">${t==='pct'?'%':t==='cop'?'COP':''}</span></div>`;
    return `<label class="prow"><div><b>${l}</b><small>${h}</small></div>${inp}</label>`;}).join('');
  $('#v-sup').innerHTML=`<div class="page"><h2>Supuestos del modelo</h2>
  <p class="muted">Editables; recalculan mapa, comparador, tabla y feed al instante.</p>
  <div class="grid2"><div class="card">${rows}</div>
  <div><div class="card"><b>Parámetros por zona (ficticios)</b>
   <div class="ctab" style="margin-top:8px"><table><thead><tr><th>Zona</th><th class="n">Estr.</th><th class="n">Arr. $/m²</th><th class="n">ADR 1/2/3h</th><th class="n">Ocup.</th></tr></thead><tbody>
   ${ZONAS.map(z=>`<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${z.color}"></i> ${z.nombre}<br><small class="muted">${z.desc}</small></td><td class="n">${z.estrato}</td><td class="n">${fK(z.arriendo_m2)}</td><td class="n">${[1,2,3].map(h=>Math.round(z.adr[h]/1000)).join('/')}k</td><td class="n">${(z.ocup*100).toFixed(0)}%</td></tr>`).join('')}
   </tbody></table></div>
   <p class="muted" style="font-size:12px">Polígonos dibujados a mano (<span class="mono">config/zonas_dibujadas.geojson</span>, editable en geojson.io). Estrato, arriendo, ADR y ocupación por zona son supuestos.</p></div>
   <div class="card" style="margin-top:16px"><b>Contrato de datos</b><p class="muted" style="font-size:12.5px">Lo que el proceso diario debe producir. Descarga el JSON de ejemplo para ver la estructura de zonas, proyectos y usados.</p>
   <button class="btn" id="dl">Descargar data.json de ejemplo</button></div></div></div></div>`;
  $('#v-sup').querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{
    const k=i.dataset.k,t=i.dataset.t;
    PARAMS[k]= t==='bool'?i.checked : t==='pct'?(+i.value)/100 : +i.value;
    renderAll(false);
  });
  $('#dl').onclick=()=>{const b=new Blob([JSON.stringify({generado:HOY,zonas:ZONAS,proyectos:PROYECTOS,usados:USADOS},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()};
}

/* ---------- KPIs y orquestación ---------- */
function renderKPIs(){
  const ps=proyFiltrados(), pr=ps.map(primaProyecto).filter(x=>x!==null);
  const hoy=PROYECTOS.filter(p=>p.detectado===HOY).length+USADOS.filter(u=>u.detectado===HOY&&elegible(u)).length;
  $('#kpis').innerHTML=`<div class="kpi"><b>${ps.length}</b><span>Proyectos</span></div>
   <div class="kpi"><b>${usadosFiltrados().length}</b><span>Usados elegibles</span></div>
   <div class="kpi"><b>${pct(median(pr))}</b><span>Sobreprecio real med.</span></div>
   <div class="kpi"><b>${hoy}</b><span>Detectados hoy</span></div>`;
}
function renderAll(withSup=true){
  renderKPIs(); renderFiltros(); renderMapa(); renderDetalle(); renderTabla(); renderUsados(); renderFeed(); if(withSup) renderSup();
}
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='mapa') setTimeout(()=>map.invalidateSize(),50);
});
async function cargarDatos(){
  if(new URLSearchParams(location.search).has('demo') || location.protocol==='file:') return;
  try{
    const r = await fetch('../data/processed/dashboard.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    // solo las zonas que trae el dashboard (si se retira una zona del config, desaparece del mapa)
    const ids=new Set((d.zonas?.features||[]).map(f=>f.properties.id));
    if(ids.size){ for(let i=ZONAS.length-1;i>=0;i--) if(!ids.has(ZONAS[i].id)){ delete Z[ZONAS[i].id]; state.zonas.delete(ZONAS[i].id); ZONAS.splice(i,1); } }
    (d.zonas?.features||[]).forEach(f=>{ const z=Z[f.properties.id];
      if(z){ z.poly = f.geometry.coordinates[0].slice(0,-1).map(([lng,lat])=>[lat,lng]);
             if(f.properties.descripcion) z.desc = f.properties.descripcion; } });
    PROYECTOS = (d.proyectos||[]).filter(p=>Z[p.zona]).map(p=>({...p, ciudad:Z[p.zona].ciudad}));
    USADOS_TODOS = (d.usados||[]).filter(u=>!u.zona || Z[u.zona])
      .map(u=>({...u, ciudad: u.zona ? Z[u.zona].ciudad : (u.lat>6 ? 'Bucaramanga' : 'Bogotá')}));
    USADOS = USADOS_TODOS.filter(u=>u.zona);
    if(d.generado) HOY = d.generado.slice(0,10);
    PENDIENTES = {sin_ubicar:d.sin_ubicar||[], fuera:d.fuera_de_zonas||[]};
    GENERADO = d.generado; MODO = 'real';
    $('#modo').textContent = USADOS.length ? 'DATOS REALES' : 'DATOS REALES · USADOS PENDIENTES';
    $('#subtitulo').textContent = `≤ ${fM(PARAMS.precio_max)} · ${USADOS.length} usados · act. ${new Date(GENERADO).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}`;
  }catch(e){ console.warn('Sin dashboard.json: modo demo.', e); }
}
cargarDatos().then(()=>{ dibujarZonas(); renderAll(); fitCiudad(); });
</script>
