# Proyectos que no aparecen en los portales escaneados, o que llegaron por otro canal
# (brochure, cotización, valla, referido). Se integran solos en cada comando de `vivienda`.
#
# Campos del proyecto:
#   id               único, sin espacios (no lo cambies después: es la llave del proyecto)
#   zonas            id de zona en config/zonas.toml
#   direccion        placa ("Calle 52 # 17-41") o cruce ("Carrera 53 con Calle 100")
#   direccion_origen "manual" (dato oficial: brochure, cotización) o "agregador" (portal / sala de ventas)
#   fuente           URL o archivo de donde salen los datos
#   opcionales: estrato, ascensor (true/false), renta_corta ("permitida"/"prohibida"),
#               entrega ("AAAA-MM"), acabados ("full"/"semi"/"obra gris"), notas
# Tipologías: habs, banos, area (construida), area_privada, precio (opcional), nombre
# Si quitas un proyecto de este archivo, queda inactivo (no se borra su historial).

[[proyecto]]
id = "lumina-77"
nombre = "Lumina 77"
constructora = "Oikos"
ciudad = "Bogotá"
sector = "El Lago"
zonas = ["lag"]
direccion = "Carrera 16A # 76-38"
direccion_origen = "manual"
fuente = "file://brochure/lumina77_brochure.pdf"
ascensor = true
entrega = "2029-04"                 # inferida: la cotización pone el crédito el 04-abr-2029
notas = "Coliving: 320 apartaestudios en 21 pisos, renovación urbana. Cotización Oikos 04-oct-2026, APT-T1 103 (piso 1): $375 M, valor acabados $0 (confirmar si se entrega terminado). Cuota inicial 30 % en 30 cuotas hasta mar-2029, 70 % crédito."

  [[proyecto.tipologia]]
  nombre = "Tipo A (APT-T1 103, cotizado)"
  habs = 1
  banos = 1
  area = 37.95
  area_privada = 33.37
  precio = 375_000_000

  [[proyecto.tipologia]]
  nombre = "Tipo E"
  habs = 1
  banos = 1
  area = 36.03
  area_privada = 30.26

