# ---------------------------------------------------------------------------
# Vivienda usada — Fincaraíz (lógica del proyecto anterior, ver sources/fincaraiz)
# ---------------------------------------------------------------------------
[fincaraiz]
max_paginas = 8            # por barrio; orden "más recientes", así que lo nuevo entra primero
dias_vigencia = 7          # un anuncio no visto en 7 días deja de mostrarse (no se borra del historial)
pausa_segundos = [3, 6]    # entre páginas; cada 10 páginas, una pausa larga de 15–25 s

# Barrios a recorrer. `ruta` es el tramo de URL de Fincaraíz:
#   Bogotá        -> https://www.fincaraiz.com.co/venta/{ruta}/bogota
#   Floridablanca -> https://www.fincaraiz.com.co/venta/apartamentos/{ruta}/floridablanca/floridablanca
# La ruta NO siempre es el nombre corto: 'san-felipe' lleva a otro lugar del país; la buena es
# 'san-felipe/zona-noroccidente'. verificado = true -> la ruta respondió y trajo anuncios dentro de zonas
# (prueba del 2026-10-25). Una ruta nueva se prueba con `vivienda usados --probar --barrio <ruta>`.
# Que una ruta traiga barrios vecinos no importa: el filtro real es el punto del anuncio.
# 'el-lago' se quitó: da el mismo total que 'lago-gaitan' (397), es el mismo listado.
# La zona de cada anuncio NO la da el barrio sino su punto en el mapa (si cae en una zona del radar).

