# Zonas del radar: un centro y un radio por zona (círculo). Es lo que se usa por defecto.
# La zona de un proyecto nuevo la decide el sector del sitio (o `zonas` en proyectos_manuales.toml);
# la de un usado, el punto del anuncio dentro de la figura de la zona.
# Para mover o agrandar una zona, cambia centro [lat, lng] o radio_m (metros).
#
# OPCIONAL — esquinas: cruces de vías EN ORDEN (recorriendo el borde). `vivienda zonas` las ubica una
# sola vez en OpenStreetMap (lento: ~1 min por esquina) y desde ahí la zona es ese polígono.
# Si una esquina falla, la zona sigue como círculo y el comando dice cuál ajustar.
# Formato de cada esquina: "Calle 39 con Avenida Caracas", "Calle 60 con Carrera 5".

[[zona]]
id = "chu"
nombre = "Chapinero Universitario"
ciudad = "Bogotá"
descripcion = "Cl. 39–60, Av. Caracas a Circunvalar"
centro = [4.6350, -74.0640]
radio_m = 1300
esquinas = [
  "Calle 39 con Avenida Caracas",
  "Calle 60 con Avenida Caracas",
  "Calle 60 con Carrera 5",
  "Calle 39 con Carrera 5",
]

