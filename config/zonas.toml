# Zonas del radar (v0.8). La FORMA de cada zona sale de config/zonas_dibujadas.geojson (dibujada a mano;
# se edita en https://geojson.io: abrir el archivo, mover vértices, guardar). Cada feature lleva properties.id.
# Aquí va lo demás: nombre, ciudad, descripción, y un centro + radio de respaldo (círculo si falta el dibujo).
#
# Qué decide la zona:
#   - usado: su punto dentro del polígono (exacto).
#   - proyecto: su punto dentro del polígono o a ≤ 150 m del borde (margen para el error de ubicación y del dibujo);
#     fuera de eso queda en "fuera de zonas". El sector del sitio solo desempata si cae en dos zonas.
# No cambies un `id` (es la llave en config.toml y proyectos_manuales.toml); el nombre, cuando quieras.
#
# OPCIONAL — esquinas: cruces de vías en orden ("Calle 45 con Avenida Caracas"); `vivienda zonas` arma el
# polígono. Solo se usan si la zona NO está dibujada.

