<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Vivienda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--panel:#fff;--ink:#1b1d1f;--muted:#6b7075;--line:#e4e2dc;--soft:#f0efea;
--accent:#1f6f5c;--accent-soft:#e3f0ec;--warn:#b7791f;--warn-soft:#fbf1dc;--bad:#b23a3a;--bad-soft:#f7e1e1;
--good:#2f7d4a;--good-soft:#e2f2e7;--new:#1f4e8c;--new-soft:#e2eaf6;--used:#7d838a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--panel:#1b1e21;--ink:#e8e6e1;--muted:#9aa0a6;--line:#2c3035;--soft:#23272b;
--accent:#5fb89e;--accent-soft:#1d332d;--warn:#e0a84a;--warn-soft:#3a2f1a;--bad:#e07070;--bad-soft:#3a2020;
--good:#6cc48a;--good-soft:#1c3324;--new:#7aa8ea;--new-soft:#1d2a3d;--used:#8b9097}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:20px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;color:var(--muted);font:500 13px Inter;padding:6px 10px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.kpi b{display:block;font-size:17px;font-weight:700}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow:auto}
.view.active{display:block}
#v-mapa.active{display:grid;grid-template-columns:270px 1fr 0;overflow:hidden}
#v-mapa.active.open{grid-template-columns:270px 1fr 440px}
#map{height:100%;min-height:300px}
.filters{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
.filters h4{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.filters h4:first-child{margin-top:0}
.seg{display:flex;background:var(--soft);border-radius:7px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:5px;font:500 12.5px Inter;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px Inter;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.off{opacity:.45}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.legend{font-size:12px;color:var(--muted);line-height:1.9}
.legend .sw{display:inline-block;width:22px;height:12px;border-radius:6px;vertical-align:middle;margin-right:6px}
.detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
.dhead{display:flex;justify-content:space-between;gap:10px}
.dhead h2{margin:0;font-size:18px;letter-spacing:-.01em}
.x{border:0;background:var(--soft);color:var(--ink);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.b{font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.b.new{background:var(--new-soft);color:var(--new)}
.b.ok{background:var(--good-soft);color:var(--good)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}
.tipos{display:flex;gap:6px;margin:12px 0}
.tipos button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px;font:500 12px Inter;cursor:pointer;text-align:left}
.tipos button.on{border-color:var(--accent);background:var(--accent-soft)}
.tipos small{display:block;color:var(--muted);font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:8px;padding:9px 10px}
.stat span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:15px}
.stat.hl{background:var(--accent-soft)}
.stat.hl.hi{background:var(--bad-soft)}.stat.hl.mid{background:var(--warn-soft)}.stat.hl.lo{background:var(--good-soft)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.bars .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;border-radius:5px}
.flags{margin:0;padding:0;list-style:none}
.flags li{font-size:12.5px;padding:7px 9px;border-radius:6px;background:var(--warn-soft);color:var(--ink);margin-bottom:5px;border-left:3px solid var(--warn)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right}
.ctab{font-size:12px;overflow:auto}
.pos{color:var(--bad)}.neg{color:var(--good)}
.page{max-width:1200px;margin:0 auto;padding:20px 16px}
.page h2{margin:0 0 4px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 10px;font:13px Inter}
#tbl tr.ex td{opacity:.45}
#tbl th,#utbl th{cursor:pointer}
#utbl th.sorted::after{content:' ▾'}
.zres{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0}
.zres .card{padding:10px 12px;cursor:pointer}
.zres .card.on{outline:2px solid var(--accent)}
.zres b{font-size:15px}
#utbl a{color:inherit;text-decoration:underline dotted}
#tbl th.sorted::after{content:' ▾'}
.feedday{margin:18px 0 8px;font-weight:600}
.fitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.fitem .p{font-weight:700;text-align:right}
.fitem small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow small{display:block;color:var(--muted);font-size:12px}
.inp{display:flex;align-items:center;gap:6px}
.inp input{width:120px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 8px;font:13px 'JetBrains Mono',monospace;text-align:right}
.btn{border:0;background:var(--accent);color:#fff;font:600 13px Inter;padding:8px 14px;border-radius:7px;cursor:pointer}
.pinwrap{background:none;border:none}
.pin{display:flex;align-items:center;justify-content:center;height:24px;padding:0 9px;border-radius:12px;color:#fff;font:700 12px Inter;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;white-space:nowrap;position:relative;width:max-content;margin:0 auto;cursor:pointer}
.pin::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
.pin.hi{background:#b23a3a}.pin.mid{background:#c58a22}.pin.lo{background:#2f7d4a}.pin.na{background:#5a5f66}
.pin.sel{outline:3px solid #1f4e8c;outline-offset:1px}
/* pin de proyecto: nombre + valor, centrado sobre el punto aunque sea más ancho que el ícono */
.pinwrap .pin.proy{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;gap:6px}
.pin.proy .pn{font-weight:500;font-size:11px;opacity:.92;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pin.proy .pv{font-weight:700}
.pin.proy.fuera{border-style:dashed}
/* Segmentos: Estándar (≥ 30 m²) | Micro (< 30 m², tipo Alma 72). Nunca se muestran juntos. */
.seg{display:flex;gap:2px;background:var(--line);padding:3px;border-radius:9px;margin-left:12px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 12.5px Inter;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-s=micro].on{background:#5b3fa3;color:#fff}
body.micro header{box-shadow:inset 0 -3px 0 #5b3fa3}
body.micro .pin.proy{border-radius:6px;box-shadow:0 0 0 2px #5b3fa3,0 2px 6px rgba(0,0,0,.35)}
.ucl{width:30px;height:30px;border-radius:50%;background:rgba(90,95,102,.85);color:#fff;font:600 11.5px Inter;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dot.usel{width:16px;height:16px;border:3px solid #111;box-shadow:0 0 0 2px #fff}
.dot{width:10px;height:10px;border-radius:50%;background:#7d838a;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dot.ex{background:transparent;border:2px dashed #7d838a}
.leaflet-popup-content{font:12.5px Inter;margin:10px 12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:900px){
 #v-mapa.active,#v-mapa.active.open{display:block;overflow:auto}
 #map{height:55vh}
 .filters,.detail{border:0;border-top:1px solid var(--line)}
 .kpis{margin-left:0}
 .grid2{grid-template-columns:1fr}
 .bars .row{grid-template-columns:110px 1fr 64px}
}
#tbl a,.ctab a{color:inherit;text-decoration:underline dotted}
/* ---------- Estadísticas ---------- */
:root{--st-used:#c97a2c;--st-used-soft:#f3e3cf;--st-new:#2f6db5;--st-rest:#d9d6cf;--st-grid:#ecebe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--st-used:#bd8038;--st-used-soft:#3a2d1f;--st-new:#5b8fd6;--st-rest:#3a3e43;--st-grid:#262a2e}}
.st-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.st-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.st-kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.st-kpi .v{font-size:24px;font-weight:700;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.st-kpi .s{font-size:12px;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st-grid .card.wide{grid-column:1/-1}
.st-grid .card h4{margin:0 0 2px;font-size:14.5px}
.st-q{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.st-take{font-size:12.5px;background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.st-leg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:0 0 6px;flex-wrap:wrap}
.st-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.st-leg i.bar{border-radius:2px;width:14px;height:8px}
.st-leg i.dia{border-radius:1px;transform:rotate(45deg);width:9px;height:9px}
.st-svg{display:block;width:100%;height:auto;overflow:visible}
.st-svg text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
.st-svg text.ink{fill:var(--ink)}
#st-tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;z-index:2000;max-width:280px}
#st-tip b{display:block;margin-bottom:2px}
.st-src{font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;display:inline-block;margin-top:3px;letter-spacing:.02em;text-transform:none}
.st-src.m{background:var(--accent-soft);color:var(--accent)}
.st-src.s{background:var(--warn-soft);color:var(--warn)}
.st-src.d{background:var(--soft);color:var(--muted)}
.st-tbl td small{color:var(--muted)}
.st-tbl tr.op{cursor:pointer}.st-tbl tr.op:hover td{background:var(--soft)}
.st-tbtn{float:right;font:12px Inter;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer}
@media (max-width:900px){.st-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">Radar Vivienda <span class="tag" id="modo">DEMO · DATOS FICTICIOS</span>
    <small id="subtitulo">Nuevos vs. usados ≤ $600 M · Bogotá y Bucaramanga</small></div>
  <nav class="tabs" id="tabs">
    <button data-v="mapa" class="on">Mapa</button>
    <button data-v="tabla">Tabla</button>
    <button data-v="usados">Usados</button>
    <button data-v="feed">Detectados</button>
    <button data-v="sup">Supuestos</button>
    <button data-v="est">Estadísticas</button>
  </nav>
  <div class="seg" id="seg"><button data-s="estandar" class="on" title="Tipologías y usados de 30 m² construidos o más">Estándar · ≥ 30 m²</button><button data-s="micro" title="Micro-apartaestudios de 18 a 30 m² (tipo Alma 72), pensados para renta corta">Micro · &lt; 30 m²</button></div>
  <div class="kpis" id="kpis"></div>
</header>
<main>
  <section class="view active" id="v-mapa">
    <aside class="filters" id="filters"></aside>
    <div id="map"></div>
    <aside class="detail" id="detail"></aside>
  </section>
  <section class="view" id="v-tabla"></section>
  <section class="view" id="v-usados"></section>
  <section class="view" id="v-feed"></section>
  <section class="view" id="v-sup"></section>
  <section class="view" id="v-est"></section>
</main>
<div id="st-tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* =========================================================
   CONTRATO DE DATOS
   En producción, ZONAS / PROYECTOS / USADOS vendrán de data.json
   que el proceso diario reescribe. Aquí van embebidos y ficticios.
   ========================================================= */
let HOY = '2026-10-25';   // en modo real se reemplaza por la fecha del dashboard.json

const PARAMS = {
  precio_max: 600e6, desc_neg: 0.07, tasa_ea: 0.10, cuota_ini: 0.30, renta_perdida: true,
  acabados_m2: 900000, factor_privada: 0.88, tol_area: 0.15, max_antig: 15, exigir_parq: false,
  com_plataforma: 0.15, gestion: 0.20, servicios_mes: 450000, predial: 0.006,
  micro_max_antig: 8, micro_tol_area: 0.20, micro_tol_area_amplia: 0.30, adr_micro: 0.85,
  min_comps: 5, radio_amplio: 1500, tol_area_amplia: 0.25, max_antig_amplia: 25
};

const PARAM_META = [
  ['precio_max','Tope de precio total','cop','Incluye parqueadero y depósito.'],
  ['desc_neg','Descuento de negociación (usados)','pct','Precio de oferta → cierre esperado.'],
  ['tasa_ea','Tasa de oportunidad E.A.','pct','Trae a valor presente los pagos sobre planos.'],
  ['cuota_ini','Cuota inicial durante obra','pct','Pagada en cuotas durante la obra; el saldo, a la entrega.'],
  ['renta_perdida','Sumar arriendo no percibido durante obra','bool','El usado renta desde el día 1; el nuevo no.'],
  ['acabados_m2','Acabados para obra gris (por m²)','cop','Se suma al precio del proyecto.'],
  ['factor_privada','Factor área privada / construida','pct','Se usa cuando el anuncio solo trae área construida.'],
  ['tol_area','Tolerancia de área (±)','pct','Para considerar un usado comparable.'],
  ['max_antig','Antigüedad máxima del usado','num','Años.'],
  ['exigir_parq','Exigir mismo número de parqueaderos','bool','Apagado = parqueadero flexible.'],
  ['micro_max_antig','Micro: antigüedad máxima del comparable','num','Años. Solo edificios recientes (la renta corta es un producto nuevo). Sin dato de antigüedad: no entra.'],
  ['micro_tol_area','Micro: tolerancia de área (±)','pct','Micro no exige el mismo número de alcobas: apartaestudio y loft compiten.'],
  ['micro_tol_area_amplia','Micro: tolerancia de área ampliada (±)','pct','Si en la zona hay menos comparables que el mínimo. La antigüedad no se amplía.'],
  ['adr_micro','Micro: ADR como fracción del de 1 alcoba','pct','Tarifa por noche de un micro frente a un apto de 1 alcoba de la misma zona (supuesto).'],
  ['min_comps','Comparables mínimos antes de ampliar criterios','num','Si la zona tiene menos, se amplían área, antigüedad y estrato (siempre dentro de la zona).'],
  ['tol_area_amplia','Tolerancia de área ampliada (±)','pct','Paso ampliado, dentro de la zona.'],
  ['max_antig_amplia','Antigüedad máxima ampliada','num','Años. Paso ampliado, dentro de la zona.'],
  ['radio_amplio','Radio de la referencia fuera de zona (m)','num','Solo informativa en el panel; no entra en el sobreprecio.'],
  ['com_plataforma','Comisión plataforma (renta corta)','pct',''],
  ['gestion','Gestión + aseo (renta corta)','pct','Sobre ingreso bruto.'],
  ['servicios_mes','Servicios + internet (renta corta, mes)','cop',''],
  ['predial','Predial anual (% del precio)','pct','']
];

function circ(c, rm, n = 40) {
  const o = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n;
    o.push([c[0] + rm / 111320 * Math.cos(a), c[1] + rm / (111320 * Math.cos(c[0] * Math.PI / 180)) * Math.sin(a)]);
  }
  return o;
}

/* Zonas: los polígonos reales llegan en dashboard.json (config/zonas_dibujadas.geojson); estos son los mismos,
   para el modo demo. Los parámetros (estrato típico, arriendo/m², ADR, ocupación) siguen siendo SUPUESTOS. */
const ZONAS = [
  {id:'chu', nombre:'Chapinero Central', ciudad:'Bogotá', color:'#7b5ea7', estrato:4, base_m2:7.4e6, admin_m2:6000, arriendo_m2:40000, adr:{1:190000,2:260000,3:330000}, ocup:.64,
   desc:'Cl. 53–70, Av. Caracas a Cra. 7', poly:[[4.64679, -74.0639], [4.644, -74.06437], [4.6435, -74.06305], [4.64323, -74.06199], [4.64542, -74.06136], [4.64644, -74.06059], [4.65086, -74.05826], [4.65362, -74.05617], [4.65572, -74.0597], [4.65726, -74.06217], [4.65371, -74.06273], [4.65179, -74.06304], [4.64972, -74.06338]]},
  {id:'c72', nombre:'Quinta Camacho – Calle 72', ciudad:'Bogotá', color:'#d4a017', estrato:5, base_m2:8.6e6, admin_m2:7000, arriendo_m2:45000, adr:{1:220000,2:300000,3:380000}, ocup:.66,

/* ---------- Generador de usados ficticios (determinístico) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function pip(pt, poly){const x=pt[1],y=pt[0];let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function diasAntes(k){const d=new Date(HOY+'T12:00:00');d.setDate(d.getDate()-k);return d.toISOString().slice(0,10)}

function genUsados(){
  const out=[]; let k=1;
  for (const z of ZONAS){
    const la=z.poly.map(p=>p[0]), ln=z.poly.map(p=>p[1]);
    const bb=[Math.min(...la),Math.max(...la),Math.min(...ln),Math.max(...ln)];
    for (let i=0;i<40;i++){
      let pt; do { pt=[bb[0]+rnd()*(bb[1]-bb[0]), bb[2]+rnd()*(bb[3]-bb[2])]; } while(!pip(pt,z.poly));
      const r=rnd(); const habs=r<.3?1:r<.8?2:3;
      const priv = habs===1?32+rnd()*18 : habs===2?48+rnd()*24 : 68+rnd()*30;
      const at=rnd(); const area_tipo = at<.7?'privada':at<.9?'construida':'desconocida';
      const area = Math.round(area_tipo==='construida'? priv/0.88 : priv);
      const antig = 1+Math.floor(Math.pow(rnd(),1.4)*34);
      const m2 = z.base_m2*1.22*(1-0.007*antig)*(0.9+0.2*rnd())*(habs===3?.96:1);
      const precio = Math.round(priv*m2/1e6)*1e6;
      const er=rnd(); const estrato = er<.85?z.estrato:(er<.93?z.estrato-1:z.estrato+1);
      const ascensor = antig>20 ? rnd()<.5 : rnd()<.93;
      const pr=rnd(); const parq = habs===1?(pr<.45?0:1):habs===2?(pr<.12?0:1):(pr<.55?1:2);
      const admin = Math.round(priv*z.admin_m2*(antig<10?1.15:antig<20?1:.85)*(0.85+.3*rnd())/1000)*1000;
      let rc; if(antig>15){rc=rnd()<.7?'prohibida':'desconocida'} else {const q=rnd(); rc=q<.35?'permitida':q<.8?'desconocida':'prohibida'}
      const nf=1+Math.floor(Math.pow(rnd(),2)*3), f0=Math.floor(rnd()*3);
      const fuentes=[...Array(nf)].map((_,j)=>FUENTES[(f0+j)%3]);

// Paso 0: criterios estrictos. Paso 1 (si hay < min_comps): misma zona con área, antigüedad y estrato ampliados.
// Con menos de 3 al final no se calcula sobreprecio (s/c).
// MICRO: solo edificios recientes (antigüedad CONOCIDA ≤ micro_max_antig), sin exigir alcobas, área ±20 % (±30 % ampliado).
function comparablesMicro(p,t){
  const base={antig:PARAMS.micro_max_antig, antigReq:true, habsLibre:true};
  const r=p.fuera_de_zona?PARAMS.radio_amplio:0, sufijo=p.fuera_de_zona?` a ≤ ${r} m (fuera de zonas)`:' misma zona';
  const pasos=[{...base, nivel:0, tol:PARAMS.micro_tol_area, radio:r, desc:`micro${sufijo}, edificios ≤ ${PARAMS.micro_max_antig} años`},
               {...base, nivel:1, tol:PARAMS.micro_tol_area_amplia, radio:r, estr:1,
                desc:`micro${sufijo}, área ±${Math.round(PARAMS.micro_tol_area_amplia*100)} %, estrato ±1, edificios ≤ ${PARAMS.micro_max_antig} años`}];
  let l; for(const o of pasos){ l=filtroComp(p,t,o); l.nivel=o.nivel; l.desc=o.desc; if(l.length>=PARAMS.min_comps) break; }
  return l;
}
function comparables(p,t){
  if(state.seg==='micro') return comparablesMicro(p,t);
  if(p.fuera_de_zona){   // proyecto en seguimiento fuera de tus zonas: no hay zona propia -> por distancia
    const r=PARAMS.radio_amplio;
    const pasosF=[{nivel:0, tol:PARAMS.tol_area, antig:PARAMS.max_antig, radio:Math.round(r*2/3), desc:`a ≤ ${Math.round(r*2/3)} m (fuera de zonas)`},
                  {nivel:1, tol:PARAMS.tol_area_amplia, antig:PARAMS.max_antig_amplia, radio:r, estr:1,
                   desc:`a ≤ ${r} m con área ±${Math.round(PARAMS.tol_area_amplia*100)} %, antigüedad ≤ ${PARAMS.max_antig_amplia} y estrato ±1 (fuera de zonas)`}];
    let lf; for(const o of pasosF){ lf=filtroComp(p,t,o); lf.nivel=o.nivel; lf.desc=o.desc; if(lf.length>=PARAMS.min_comps) break; }
    return lf;
  }
  const pasos=[
    {nivel:0, tol:PARAMS.tol_area, antig:PARAMS.max_antig, radio:0, desc:'misma zona'},
    {nivel:1, tol:PARAMS.tol_area_amplia, antig:PARAMS.max_antig_amplia, radio:0, estr:1,
     desc:`misma zona con área ±${Math.round(PARAMS.tol_area_amplia*100)} %, antigüedad ≤ ${PARAMS.max_antig_amplia} años y estrato ±1`}];
  let l;
  for(const o of pasos){ l=filtroComp(p,t,o); l.nivel=o.nivel; l.desc=o.desc; if(l.length>=PARAMS.min_comps) break; }
  return l;
}
// Calidad de la muestra: fuera las unidades de proyecto nuevo publicadas como usados, y máximo 2 por edificio
// (las de área más parecida). Sin esto, 6 unidades de un mismo edificio nuevo eran "los comparables" de La Cité.
const MAX_POR_EDIFICIO = 2;
// Mismo inmueble publicado dos veces (otra inmobiliaria, otro ID): mismo precio, misma área, misma cantidad de
// alcobas y a ≤ 150 m -> cuenta una sola vez.
function sinDuplicados(l){
  const vistos=[];
  return l.filter(u=>{ const dup=vistos.some(v=>v.precio===u.precio && v.area===u.area && v.habs===u.habs && distM(v.lat,v.lng,u.lat,u.lng)<=150);
    if(!dup) vistos.push(u); return !dup; });
}
function depurarMuestra(l, ap){
  const g={}, out=[];
  sinDuplicados(l.filter(u=>!u.unidad_proyecto))
   .sort((a,b)=>Math.abs(areaPriv(a.area,a.area_tipo)-ap)-Math.abs(areaPriv(b.area,b.area_tipo)-ap))
   .forEach(u=>{ const k=u.edificio||u.id; g[k]=(g[k]||0)+1; if(g[k]<=MAX_POR_EDIFICIO) out.push(u); });
  return out;
}
// Referencia "vs. proyectos nuevos cercanos" (informativa, no entra en el pin): unidades de proyecto nuevo publicadas
// en Fincaraíz + tipologías de los otros proyectos del radar, misma cantidad de alcobas, área ±25 %, a ≤ radio_amplio.
// Precio de lista por m² de área privada contra precio de lista; un valor por edificio/proyecto (mediana), para que
// uno con muchas unidades no domine.
function nuevosCercanos(p,t){
  const ap=apNuevo(p,t), r=PARAMS.radio_amplio, ciudad=Z[p.zona].ciudad, porEd={};
  const libre = state.seg==='micro';
  COMP_UT.forEach(u=>{ if(!u.unidad_proyecto || (!libre && u.habs!==t.habs) || u.precio>PARAMS.precio_max*1.5) return;
    const a=areaPriv(u.area,u.area_tipo); if(Math.abs(a/ap-1)>0.25 || distM(p.lat,p.lng,u.lat,u.lng)>r) return;
    (porEd['FR '+(u.edificio||u.id)]=porEd['FR '+(u.edificio||u.id)]||{nombre:u.barrio||'Edificio sin nombre', m2:[]}).m2.push(u.precio/a); });
  PROYECTOS.forEach(q=>{ if(q.id===p.id || Z[q.zona]?.ciudad!==ciudad || distM(p.lat,p.lng,q.lat,q.lng)>r) return;
    q.tipologias.forEach(tq=>{ if(!tq.precio || (!libre && tq.habs!==t.habs)) return; const a=apNuevo(q,tq); if(Math.abs(a/ap-1)>0.25) return;
      (porEd['P '+q.id]=porEd['P '+q.id]||{nombre:q.nombre, m2:[]}).m2.push(tq.precio/a); }); });
  const eds=Object.values(porEd).map(e=>({nombre:e.nombre, m2:median(e.m2), n:e.m2.length}));
  const med=median(eds.map(e=>e.m2));
  return {eds, med, prima: t.precio && med ? (t.precio/ap)/med-1 : null};
}
// Referencia (solo informativa): usados parecidos FUERA de la zona, a ≤ radio_amplio del proyecto.
function referenciaEntorno(p,t){
  if(p.fuera_de_zona) return [];
  const o = state.seg==='micro'
    ? {tol:PARAMS.micro_tol_area_amplia, antig:PARAMS.micro_max_antig, antigReq:true, habsLibre:true, radio:PARAMS.radio_amplio, estr:1}
    : {tol:PARAMS.tol_area_amplia, antig:PARAMS.max_antig_amplia, radio:PARAMS.radio_amplio, estr:1};
  return filtroComp(p,t,o)
    .filter(u=>u.zona!==p.zona);
}
function rentab(precio, ap, habs, z, adminMes, rc){
  const largo = z.arriendo_m2*ap;
  const cortoB = z.adr[Math.min(habs,3)]*(state.seg==='micro'?PARAMS.adr_micro:1)*30*z.ocup;
  const cortoN = cortoB*(1-PARAMS.com_plataforma-PARAMS.gestion) - PARAMS.servicios_mes;
  const predialMes = precio*PARAMS.predial/12;
  return {largo, cortoN, yL:(largo-adminMes-predialMes)*12/precio, yC: rc==='prohibida'?null:(cortoN-adminMes-predialMes)*12/precio};
}
function analisis(p,ti){
  const t=p.tipologias[ti], n=ajusteNuevo(p,t);
  const L=comparables(p,t), comps=L.map(u=>({u,a:ajusteUsado(u)}));
  const med=median(comps.map(c=>c.a.m2)), medL=median(comps.map(c=>c.a.m2_lista));
  const ok = !!t.precio && comps.length>=3;
  // referencia fuera de la zona: se muestra en el panel, NUNCA entra en el sobreprecio del pin
  const R=referenciaEntorno(p,t).map(u=>ajusteUsado(u)), medR=median(R.map(a=>a.m2)), NV=nuevosCercanos(p,t);
  return {t,n,comps,med,medL,nivel:L.nivel,desc:L.desc, prima:ok?n.m2/med-1:null, primaL:ok?n.m2_lista/medL-1:null,
          ref:{n:R.length, med:medR, prima: t.precio&&R.length>=3 ? n.m2/medR-1 : null}, nuevos:NV};
}
function infoProyecto(p){
  const as=p.tipologias.map((_,i)=>analisis(p,i)), v=as.filter(a=>a.prima!==null);
  const r=as.filter(a=>a.ref.prima!==null), nv=as.filter(a=>a.nuevos.prima!==null && a.nuevos.eds.length>=2);
  return {prima: v.length?v.reduce((s,a)=>s+a.prima,0)/v.length:null, nivel: v.length?Math.max(...v.map(a=>a.nivel)):null,
          maxComps: Math.max(0,...as.map(a=>a.comps.length)),
          refPrima: r.length?r.reduce((s,a)=>s+a.ref.prima,0)/r.length:null,
          nuevosPrima: nv.length?nv.reduce((s,a)=>s+a.nuevos.prima,0)/nv.length:null,
          nuevosN: nv.length?Math.max(...nv.map(a=>a.nuevos.eds.length)):0};
}
function primaProyecto(p){return infoProyecto(p).prima}
const desde = p => { const v=p.tipologias.map(t=>t.precio).filter(x=>x); return v.length?Math.min(...v):null; };
const clsPrima = v => v===null?'na':v>.30?"hi":v>.15?"mid":"lo";

/* ---------- Formato ---------- */
const fM = v => (v==null||isNaN(v))?'—':'$'+Math.round(v/1e6).toLocaleString('es-CO')+' M';
const fM1 = v => (v==null||isNaN(v))?'—':'$'+(v/1e6).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';
const fK = v => (v==null||isNaN(v))?'—':'$'+Math.round(v/1000).toLocaleString('es-CO')+' k';
const pct = (v,s=true) => v===null||v===undefined?'—':((s&&v>=0)?'+':'')+(v*100).toFixed(1)+'%';
const rcBadge = rc => rc==='permitida'?'<span class="b ok">Renta corta: sí</span>':rc==='prohibida'?'<span class="b bad">Renta corta: no</span>':'<span class="b warn">Renta corta: ¿?</span>';
const areaFlag = t => t==='construida'?' <span title="Área anunciada es construida; privada estimada">⚠</span>':t==='desconocida'?' <span title="Tipo de área no especificado">?</span>':'';
const $ = s => document.querySelector(s);
const nombreUsado = u => `${u.tipo==='apartaestudio'?'Apartaestudio':'Apto'} ${u.habs??'?'} hab`;
const antig = u => u.antiguedad==null ? 'antig. s/d' : (u.antiguedad_texto || u.antiguedad+' años');
const ascNota = u => u.ascensor===true && (u.ascensor_fuente||'').startsWith('probable') ? ' · ascensor probable (6+ pisos)' : u.ascensor!==true ? ' · ascensor sin confirmar' : '';

/* ---------- Estado ---------- */
const state = {ciudad:'Bogotá', zonas:new Set(ZONAS.map(z=>z.id)), estados:new Set(['Sobre planos','En construcción','Entrega inmediata','Sin dato']),
  habs:new Set([1,2,3]), soloRC:false, soloRCok:false, capa:'nuevos', selU:null, precioMax:600e6, sel:null, tip:0, sort:{k:'detectado',d:-1}, q:'', tipo:'Todos', excl:false,
  seg:(()=>{ try{ return localStorage.getItem('vivienda.seg')==='micro'?'micro':'estandar'; }catch(e){ return 'estandar'; } })()};

function proyFiltrados(){
  return PROYECTOS.filter(p => p.ciudad===state.ciudad && state.zonas.has(p.zona) && state.estados.has(p.estado)
    && p.tipologias.some(t=>state.habs.has(t.habs) && (!t.precio || t.precio<=Math.min(state.precioMax,PARAMS.precio_max)))
    && (!state.soloRC || p.renta_corta!=='prohibida')
    && (!state.soloRCok || p.renta_corta==='permitida'));
}
function usadosFiltrados(){
  return USADOS.filter(u => u.ciudad===state.ciudad && state.zonas.has(u.zona) && state.habs.has(u.habs) && u.precio<=Math.min(state.precioMax,PARAMS.precio_max) && u.ascensor===true
    && (!state.soloRC || u.renta_corta!=='prohibida'));
}

/* ---------- Mapa ---------- */
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const map = L.map('map',{zoomControl:true});
/* Mapas base gratuitos, sin API key. Se prueba el primero; si sus teselas fallan
   (p. ej. OSM exige un Referer y el archivo se abrió con doble clic), se pasa al siguiente. */
const BASEMAPS = [
  {url:`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark?'World_Dark_Gray_Base':'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`,
   opt:{attribution:'Tiles &copy; Esri', maxZoom:16}},
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{attribution:'&copy; OpenStreetMap', maxZoom:19}}
];
let baseIdx = 0, baseLayer = null, baseErr = 0;
function setBase(i){
  if(baseLayer) map.removeLayer(baseLayer);
  baseIdx = i; baseErr = 0;
  baseLayer = L.tileLayer(BASEMAPS[i].url, BASEMAPS[i].opt)
    .on('tileerror', () => { if(++baseErr > 3 && baseIdx < BASEMAPS.length-1) setBase(baseIdx+1); })
    .addTo(map);
  baseLayer.bringToBack();
}
setBase(0);
const zoneLayer=L.layerGroup().addTo(map), projLayer=L.layerGroup().addTo(map), compLayer=L.layerGroup().addTo(map);
// grupos en gris neutro: el verde/rojo queda reservado para el precio de cada punto
const usedLayer=L.markerClusterGroup({maxClusterRadius:40,showCoverageOnHover:false,disableClusteringAtZoom:16,
  iconCreateFunction:c=>L.divIcon({className:'pinwrap',html:`<div class="ucl">${c.getChildCount()}</div>`,iconSize:[30,30]})});
function dibujarZonas(){zoneLayer.clearLayers();ZONAS.forEach(z => L.polygon(z.poly,{color:z.color,weight:1.2,opacity:.7,fillOpacity:.04,dashArray:'4 4'}).bindTooltip(`<b>${z.nombre}</b><br>${z.desc}`,{sticky:true}).addTo(zoneLayer));}

function fitCiudad(){const pts=ZONAS.filter(z=>z.ciudad===state.ciudad).flatMap(z=>z.poly);map.fitBounds(pts,{padding:[30,30]})}

function renderMapa(){
  projLayer.clearLayers(); usedLayer.clearLayers(); compLayer.clearLayers();
  if(state.capa!=='usados') proyFiltrados().forEach(p=>{
    const I=infoProyecto(p), pr=I.prima, c=clsPrima(pr);
    const etiqueta = pr!==null ? (I.nivel>0?'≈':'')+pct(pr) : desde(p)===null ? 's/precio' : USADOS.length ? 's/c' : fM(desde(p));
    const motivo = pr!==null ? (I.nivel>0?'Sobreprecio vs. usados de la zona con criterios ampliados (área, antigüedad, estrato)':`Sobreprecio real vs. usados comparables de la zona`)
      : desde(p)===null ? 'Precio no publicado: no se puede comparar'
      : USADOS.length ? `Sin usados comparables suficientes en la zona (${I.maxComps} de 3 mínimos)${I.refPrima!==null?`. Referencia usados fuera de la zona: ${pct(I.refPrima)}`:''}` : '';
    const motivoNuevos = I.nuevosPrima!==null ? `<br><span style="color:#666">vs. ${I.nuevosN} proyectos nuevos cercanos (precio de lista): ${pct(I.nuevosPrima)}</span>` : '';
    const estadoTxt = (p.estado && p.estado!=='Sin dato' ? p.estado : `Entrega ${p.entrega||'s/d'}`)
      + (p.fuera_de_zona ? ` · fuera de tus zonas (a ${p.distancia_zona_m} m de ${Z[p.zona].nombre})` : '');
    const icon=L.divIcon({className:'pinwrap',html:`<div class="pin proy ${c} ${p.fuera_de_zona?'fuera':''} ${state.sel===p.id?'sel':''}"><span class="pn">${p.nombre}</span><span class="pv">${etiqueta}</span></div>`,iconSize:[80,30],iconAnchor:[40,34]});
    L.marker([p.lat,p.lng],{icon,zIndexOffset:1000}).on('click',()=>selProyecto(p.id))
      .bindTooltip(`<b>${p.nombre}</b><br>${estadoTxt} · ${desde(p)?'desde '+fM(desde(p)):'precio no publicado'}${motivo?`<br><span style="color:#666">${etiqueta} = ${motivo}</span>`:''}${motivoNuevos}`,{direction:'top',offset:[0,-30]}).addTo(projLayer);
  });
  if(state.capa!=='nuevos'){
    const us=usadosFiltrados(), medZ={};
    Object.keys(Z).forEach(z=>medZ[z]=median(us.filter(u=>u.zona===z).map(u=>ajusteUsado(u).m2_lista)));
    us.forEach(u=>{
      const a=ajusteUsado(u), dv=medZ[u.zona]?a.m2_lista/medZ[u.zona]-1:0;
      const col=dv<=-0.10?'#2f7d4a':dv>=0.10?'#b23a3a':'#7d838a';
      const selU=state.selU===u.id;
      L.marker([u.lat,u.lng],{icon:L.divIcon({className:'pinwrap',html:`<div class="dot ${selU?'usel':''}" style="background:${col}"></div>`,iconSize:selU?[18,18]:[10,10]}),zIndexOffset:selU?900:0})
        .on('click',()=>selUsado(u.id))
        .bindTooltip(`<b>${nombreUsado(u)} · ${u.area} m²</b>${u.barrio?' · '+u.barrio:''}<br>${fM(u.precio)} · ${fM1(a.m2_lista)}/m² <small>(${pct(dv)} vs. zona)</small><br><small class="muted">clic para ver detalle</small>`,{direction:'top'})
        .addTo(usedLayer);
    });
    if(!map.hasLayer(usedLayer)) usedLayer.addTo(map);
  } else if(map.hasLayer(usedLayer)) map.removeLayer(usedLayer);

  const p=PROYECTOS.find(x=>x.id===state.sel);
  if(p){
    const medZc={};   // mediana $/m² de anuncio por zona, sobre todos los usados (como en la capa de usados)
    const medianaZ = z => z in medZc ? medZc[z] : (medZc[z]=median(USADOS.filter(x=>x.zona===z).map(x=>ajusteUsado(x).m2_lista)));
    analisis(p,state.tip).comps.forEach(({u,a})=>{
      const mz=u.zona?medianaZ(u.zona):null, dv=mz?a.m2_lista/mz-1:null;
      L.polyline([[p.lat,p.lng],[u.lat,u.lng]],{color:'#1f4e8c',weight:1.2,dashArray:'3 4',opacity:.7}).addTo(compLayer);
      L.circleMarker([u.lat,u.lng],{radius:6,color:'#fff',weight:2,fillColor:'#1f4e8c',fillOpacity:1})
        .bindTooltip(`<b>${nombreUsado(u)} · ${u.area} m²</b>${u.barrio?' · '+u.barrio:''}<br>${fM(u.precio)} · ${fM1(a.m2_lista)}/m²${dv!==null?` <small>(${pct(dv)} vs. zona)</small>`:''}`
          + `<br><small>Comparable: ${fM1(a.m2)}/m² ajustado (privada, −${Math.round(PARAMS.desc_neg*100)} % negociación)</small>`
          + `<br><small class="muted">${u.zona?'clic para ver detalle':'fuera de zonas · clic abre el anuncio'}</small>`,{direction:'top'})
        .on('click',()=>{ if(u.zona) selUsado(u.id); else if(u.url) window.open(u.url,'_blank','noopener'); }).addTo(compLayer);
    });
  }
}

  ${state.capa==='usados'?'':`<div class="legend">
    Cuánto más cuesta el nuevo que sus usados comparables, ya ajustado (sobreprecio real):<br>
    <span class="sw" style="background:#2f7d4a"></span>&lt; 15%<br>

    <span class="sw" style="background:#5a5f66"></span>${USADOS.length?'s/c = menos de 3 comparables · s/precio = precio no publicado<br><b>≈</b> = pocos usados parecidos en la zona: criterios ampliados (siempre dentro de la zona)'+(state.seg==='micro'?'<br><b>Micro</b>: comparables solo de edificios ≤ '+PARAMS.micro_max_antig+' años, sin exigir alcobas':''):'sin usados aún (muestra precio desde)'}

/* ---------- Tabla ---------- */
function filasTabla(){
  const rows=[];
  PROYECTOS.filter(p=>p.ciudad===state.ciudad).forEach(p=>p.tipologias.forEach((t,i)=>{
    const n=ajusteNuevo(p,t);
    rows.push({tipo:'Nuevo',id:p.id+'-'+(i+1),nombre:p.nombre,zona:Z[p.zona].nombre,estrato:Z[p.zona].estrato,habs:t.habs,area:t.area,area_tipo:t.area_privada?'privada':p.area_tipo,ap:n.ap,parq:t.parq,ascensor:true,
      admin:p.admin_m2?p.admin_m2*n.ap:null,precio:t.precio,m2:n.m2_lista,edad:'Entrega '+p.entrega,rc:p.renta_corta,fuentes:[p.fuente],detectado:p.detectado,excl:t.precio>PARAMS.precio_max?'Sobre tope':''});
  }));
  USADOS.filter(u=>u.ciudad===state.ciudad).forEach(u=>{
    const a=ajusteUsado(u);
    rows.push({tipo:'Usado',id:u.id,url:u.url,nombre:`${nombreUsado(u)}${u.piso?' · piso '+u.piso:''}${u.barrio?' · '+u.barrio:''}`,zona:Z[u.zona].nombre,estrato:u.estrato,habs:u.habs,area:u.area,area_tipo:u.area_tipo,ap:a.ap,parq:u.parq,ascensor:u.ascensor,
      admin:u.admin,precio:u.precio,m2:a.m2_lista,edad:antig(u),rc:u.renta_corta,fuentes:u.fuentes,detectado:u.detectado,excl:u.ascensor===false?'Sin ascensor':u.ascensor!==true?'Ascensor sin confirmar':u.precio>PARAMS.precio_max?'Sobre tope':''});
  });
  return rows;
}
const COLS=[['tipo','Tipo'],['id','ID'],['nombre','Inmueble'],['zona','Zona'],['estrato','Estr.',1],['habs','Hab',1],['ap','Á. priv',1],['parq','Parq',1],['admin','Admin',1],['adm2','Adm/m²',1],['precio','Precio',1],['m2','$/m²',1],['edad','Antig./Entrega'],['rc','R. corta'],['fuentes','Fuentes',1],['detectado','Detectado']];
function renderTabla(){
  let rows=filasTabla().map(r=>({...r,adm2:r.admin?r.admin/r.ap:null}));
  const ex=rows.filter(r=>r.excl).length;
  if(!state.excl) rows=rows.filter(r=>!r.excl);
  if(state.tipo!=='Todos') rows=rows.filter(r=>r.tipo===state.tipo);
  if(state.q){const q=state.q.toLowerCase();rows=rows.filter(r=>(r.nombre+r.zona+r.id).toLowerCase().includes(q))}
  const {k,d}=state.sort; rows.sort((a,b)=>{const x=k==='fuentes'?a.fuentes.length:a[k], y=k==='fuentes'?b.fuentes.length:b[k]; return (x>y?1:x<y?-1:0)*d});
  $('#v-tabla').innerHTML=`<div class="page"><h2>Inventario · ${state.ciudad}</h2>

   <span class="muted">${rows.length} filas</span></div>
  <div class="card" style="padding:0;overflow:auto;max-height:70vh"><table id="tbl"><thead><tr>${COLS.map(([c,l,num])=>`<th data-k="${c}" class="${num?'n':''} ${state.sort.k===c?'sorted':''}">${l}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.excl?'ex':''}" title="${r.excl}">
   <td><span class="b ${r.tipo==='Nuevo'?'new':''}">${r.tipo}</span></td><td class="mono">${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.id}</a>`:r.id}</td><td>${r.nombre}${r.excl?` <span class="b bad">${r.excl}</span>`:''}</td><td>${r.zona}</td>
   <td class="n">${r.estrato??'?'}</td><td class="n">${r.habs??'?'}</td><td class="n">${r.ap.toFixed(0)}${areaFlag(r.area_tipo)}</td><td class="n">${r.parq??'?'}</td>
   <td class="n">${fK(r.admin)}</td><td class="n">${fK(r.adm2)}</td><td class="n">${fM(r.precio)}</td><td class="n mono">${fM1(r.m2)}</td><td>${r.edad}</td>
   <td>${r.rc==='permitida'?'✓':r.rc==='prohibida'?'✗':'?'}</td><td class="n" title="${r.fuentes.join(', ')}">${r.fuentes.length}</td><td class="mono">${r.detectado}</td></tr>`).join('')}
  </tbody></table></div></div>`;
  $('#q').oninput=e=>{state.q=e.target.value;renderTabla();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  $('#tp').onchange=e=>{state.tipo=e.target.value;renderTabla()};
  $('#ex').onchange=e=>{state.excl=e.target.checked;renderTabla()};
  $('#tbl').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;state.sort={k,d:state.sort.k===k?-state.sort.d:-1};renderTabla()});
}

/* ---------- Usados (inventario de mercado, independiente de los proyectos) ---------- */
const US = {zona:'Todas', habs:'Todas', asc:'ok', precioMax:600e6, q:'', sort:{k:'m2',d:1}};
function usadosVista(){
  return USADOS.filter(u => u.ciudad===state.ciudad).map(u => {
    const a = ajusteUsado(u);
    const cambio = u.precio_inicial && u.precio_inicial!==u.precio ? u.precio/u.precio_inicial-1 : null;
    const asc = u.ascensor===true ? ((u.ascensor_fuente||'').startsWith('probable')?'probable':'sí') : u.ascensor===false?'no':'¿?';
    return {...u, ap:a.ap, m2:a.m2_lista, adm2:u.admin? u.admin/a.ap : null, cambio, asc,
            zonaN: Z[u.zona].nombre};
  });
}
function filtrarUsados(rows){
  return rows.filter(r => (US.zona==='Todas' || r.zona===US.zona)
    && (US.habs==='Todas' || (US.habs==='3+' ? r.habs>=3 : r.habs===+US.habs))
    && r.precio<=US.precioMax
    && (US.asc==='todos' || (US.asc==='ok' ? r.ascensor===true : r.asc==='sí'))
    && (!US.q || ((r.barrio||'')+' '+r.zonaN+' '+r.id).toLowerCase().includes(US.q.toLowerCase())));
}

     <b>${r.n}</b> <small class="muted">anuncios</small><br><small>${fM1(r.m2)}/m² · adm ${fK(r.adm2)}/m²<br>precio mediano ${fM(r.precio)}</small></div>`).join('')}</div>

   <p class="muted" style="font-size:12px">Polígonos dibujados a mano (<span class="mono">config/zonas_dibujadas.geojson</span>, editable en geojson.io). Estrato, arriendo, ADR y ocupación por zona son supuestos (valores puestos a mano). Lo que sí se mide de los anuncios (estrato, $/m², administración, rebajas, días publicado) está en la pestaña <b>Estadísticas</b>.</p></div>
   <div class="card" style="margin-top:16px"><b>Contrato de datos</b><p class="muted" style="font-size:12.5px">Lo que el proceso diario debe producir. Descarga el JSON de ejemplo para ver la estructura de zonas, proyectos y usados.</p>
   <button class="btn" id="dl">Descargar data.json de ejemplo</button></div></div></div></div>`;
  $('#v-sup').querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{
    const k=i.dataset.k,t=i.dataset.t;
    PARAMS[k]= t==='bool'?i.checked : t==='pct'?(+i.value)/100 : +i.value;
    renderAll(false);
  });
  $('#dl').onclick=()=>{const b=new Blob([JSON.stringify({generado:HOY,zonas:ZONAS,proyectos:PROYECTOS,usados:USADOS},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()};
}

/* ---------- Estadísticas ----------
   Todo sale de lo que ya carga el dashboard (usados vigentes de la pestaña de segmento + tipologías nuevas).
   Muestra: usados elegibles (ascensor y ≤ tope) sin unidades de proyecto ni duplicados; $/m² de lista sobre área
   privada (igual que la pestaña Usados). Proyectos nuevos: un valor por proyecto (mediana de sus tipologías) para que
   uno con muchas tipologías no domine; los que están fuera de zonas no entran en la comparación por zona. */
const ST_MIN_N = 5;        // menos que esto: la mediana de la zona se marca "pocos datos"
const ST_OPORT = -0.10;    // oportunidad: $/m² ≥ 10 % bajo la mediana de su zona (mismo umbral que el verde del mapa)
const TRAMOS = [['menor a 1',0.5],['1 a 8',4.5],['9 a 15',12],['16 a 30',23],['más de 30',35]];
const stQ = (a,p) => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), i=(s.length-1)*p, lo=Math.floor(i);
  return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo); };
const stModa = a => { const c={}; a.forEach(v=>c[v]=(c[v]||0)+1); const k=Object.keys(c).sort((x,y)=>c[y]-c[x])[0]; return k==null?null:+k; };
const stP = (v,d=0) => v==null||isNaN(v) ? '—' : (v*100).toLocaleString('es-CO',{maximumFractionDigits:d,minimumFractionDigits:d})+' %';
const stPesos = v => v==null||isNaN(v) ? '—' : '$'+(Math.round(v/100)*100).toLocaleString('es-CO');
const stDias = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const stEsc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const stSvg = (w,h,g) => `<svg class="st-svg" viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
const stBar = (x,yTop,w,yBase) => yBase-yTop<4 ? `M${x},${yBase}V${yTop}H${x+w}V${yBase}Z`   // barra con punta redondeada de 4 px
  : `M${x},${yBase}V${yTop+4}q0,-4 4,-4H${x+w-4}q4,0 4,4V${yBase}Z`;
let ST_TABLA = false;

function stDatos(){
  const ciudad = state.ciudad, zs = ZONAS.filter(z=>z.ciudad===ciudad);
  const todos = USADOS.filter(u=>u.ciudad===ciudad);
  const el = sinDuplicados(todos.filter(u=>elegible(u) && !u.unidad_proyecto)).map(u=>{
    const ap=areaPriv(u.area,u.area_tipo), ini=u.precio_inicial||u.precio;
    const maxP=Math.max(ini, ...(u.precios||[]).map(x=>x.precio));
    return {...u, ap, m2:u.precio/ap, adm2:u.admin?u.admin/ap:null,
      rebaja: u.precio<maxP ? 1-u.precio/maxP : 0,
      dias: stDias(u.creado_portal||u.detectado, HOY),
      tramo: u.antiguedad==null ? null : (TRAMOS.find(([,v])=>Math.abs(v-u.antiguedad)<0.01)||[u.antiguedad<1?'menor a 1':u.antiguedad<=8?'1 a 8':u.antiguedad<=15?'9 a 15':u.antiguedad<=30?'16 a 30':'más de 30'])[0]};
  });
  const nuevos = PROYECTOS.filter(p=>p.ciudad===ciudad && !p.fuera_de_zona).map(p=>{
    const v=p.tipologias.filter(t=>t.precio).map(t=>({area:apNuevo(p,t), m2:t.precio/apNuevo(p,t)}));
    return {p, tipos:v, m2:median(v.map(x=>x.m2))};
  }).filter(x=>x.tipos.length);
  const porZona = zs.map(z=>{
    const u=el.filter(x=>x.zona===z.id), n=nuevos.filter(x=>x.p.zona===z.id), m2=u.map(x=>x.m2);
    const arr = z.arriendo_m2, med = median(m2), adm = median(u.filter(x=>x.adm2).map(x=>x.adm2));
    return {z, n:u.length, total:todos.filter(x=>x.zona===z.id).length, p25:stQ(m2,.25), p50:med, p75:stQ(m2,.75),
      nuevo: median(n.map(x=>x.m2)), nN:n.length, estrato: stModa(u.map(x=>x.estrato).filter(x=>x!=null)),
      adm2: adm, dias: median(u.map(x=>x.dias)), conRebaja: u.length? u.filter(x=>x.rebaja>0).length/u.length : null,
      yB: med ? arr*12/med : null,
      yN: med ? ((arr-(adm||0))*12)/med - PARAMS.predial : null};
  });
  return {ciudad, zs, todos, el, nuevos, porZona};
}

function renderEst(){
  const el = $('#v-est'); if(!el) return;
  const D = stDatos(), Z0 = D.porZona, conN = Z0.filter(z=>z.n>=ST_MIN_N);
  const micro = state.seg==='micro';
  if(!D.el.length){ el.innerHTML=`<div class="page"><h2>Estadísticas</h2><div class="empty">No hay usados elegibles en ${D.ciudad} para este segmento.</div></div>`; return; }

  // KPIs
  const primas = Z0.filter(z=>z.nN && z.n>=ST_MIN_N).map(z=>z.nuevo/z.p50-1);
  const reb = D.el.filter(u=>u.rebaja>0);
  const seguimiento = median(D.el.map(u=>stDias(u.detectado,HOY)));
  const kpis = [
    ['Usados que cumplen', D.el.length.toLocaleString('es-CO'), `de ${D.todos.length.toLocaleString('es-CO')} vigentes · ${D.nuevos.length} proyectos nuevos con precio`],
    ['$/m² mediano usado', fM1(median(D.el.map(u=>u.m2))), 'precio de lista sobre área privada'],
    ['Prima mediana de lo nuevo', primas.length ? pct(median(primas)) : '—', `nuevo vs. usado, misma zona (${primas.length} zonas)`],
    ['Rebaja observada', reb.length ? stP(median(reb.map(u=>u.rebaja)),1) : '—', `mediana · ${stP(reb.length/D.el.length)} de los anuncios bajó precio`],
    ['Días publicado', Math.round(median(D.el.map(u=>u.dias)))+' días', 'mediana desde la publicación en el portal'],
  ];

  // 1 · rango de $/m² por zona y prima de lo nuevo
  const c1 = (()=>{
    const zs = Z0.filter(z=>z.n>=3).sort((a,b)=>b.p50-a.p50);
    if(!zs.length) return {svg:'<div class="empty">Sin datos.</div>', take:'', tabla:''};
    const W=1100, L=230, R=80, row=30, H=zs.length*row+34;
    const vals = zs.flatMap(z=>[z.p25,z.p75,z.nuevo]).filter(v=>v!=null);
    const lo=Math.floor(Math.min(...vals)/1e6)*1e6, hi=Math.ceil(Math.max(...vals)/1e6)*1e6, paso=(hi-lo)>8e6?2e6:1e6;
    const x=v=>L+(v-lo)/(hi-lo)*(W-L-R);
    let g='';
    for(let t=lo;t<=hi;t+=paso) g+=`<line x1="${x(t)}" x2="${x(t)}" y1="6" y2="${H-26}" stroke="var(--st-grid)"/><text x="${x(t)}" y="${H-10}" text-anchor="middle">${t/1e6} M</text>`;
    zs.forEach((z,i)=>{
      const y=14+i*row, pr=z.nuevo!=null ? z.nuevo/z.p50-1 : null, poco=z.n<ST_MIN_N;
      const tip=`<b>${z.z.nombre}</b>Usados: mediana ${fM1(z.p50)}/m² · rango ${fM1(z.p25)}–${fM1(z.p75)} (n=${z.n})${poco?' · pocos datos':''}<br>`+
        (z.nN?`Nuevos: mediana ${fM1(z.nuevo)}/m² (${z.nN} proyecto${z.nN>1?'s':''})<br>Prima: ${pct(pr)}`:'Sin proyectos nuevos con precio en esta zona');
      g+=`<g data-tip="${stEsc(tip)}"><rect x="0" y="${y-13}" width="${W}" height="${row}" fill="transparent"/>
        <text x="0" y="${y+4}" class="ink">${z.z.nombre}</text><text x="${L-10}" y="${y+4}" text-anchor="end">n=${z.n}${poco?' ·':''}</text>
        <rect x="${x(z.p25)}" y="${y-5}" width="${Math.max(2,x(z.p75)-x(z.p25))}" height="10" rx="4" fill="var(--st-used-soft)" stroke="var(--st-used)" ${poco?'stroke-dasharray="3 2"':''}/>
        ${pr!=null?`<line x1="${x(z.p50)}" x2="${x(z.nuevo)}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="2 3"/>`:''}
        <circle cx="${x(z.p50)}" cy="${y}" r="5" fill="var(--st-used)" stroke="var(--panel)" stroke-width="2"/>
        ${pr!=null?`<rect x="${x(z.nuevo)-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x(z.nuevo)} ${y})" fill="var(--st-new)" stroke="var(--panel)" stroke-width="2"/>`:''}
        <text x="${W-4}" y="${y+4}" text-anchor="end" class="${pr!=null?'ink':''}">${pr!=null?pct(pr):'—'}</text></g>`;
    });
    const conP = zs.filter(z=>z.nuevo!=null && z.n>=ST_MIN_N).sort((a,b)=>(a.nuevo/a.p50)-(b.nuevo/b.p50));
    const take = conP.length>=2 ? `Con al menos ${ST_MIN_N} usados de referencia, la prima de lo nuevo va de <b>${pct(conP[0].nuevo/conP[0].p50-1)}</b> (${conP[0].z.nombre}) a <b>${pct(conP.at(-1).nuevo/conP.at(-1).p50-1)}</b> (${conP.at(-1).z.nombre}). Es precio de lista contra precio de lista: el sobreprecio real (valor presente, obra gris, arriendo perdido y negociación) está en el mapa.`
      : 'Hay muy pocas zonas con proyectos nuevos y suficientes usados para comparar.';
    const tabla = `<table class="st-tbl"><thead><tr><th>Zona</th><th class="n">n</th><th class="n">P25</th><th class="n">Mediana</th><th class="n">P75</th><th class="n">Nuevo</th><th class="n">Prima</th></tr></thead><tbody>${
      zs.map(z=>`<tr><td>${z.z.nombre}</td><td class="n">${z.n}</td><td class="n">${fM1(z.p25)}</td><td class="n">${fM1(z.p50)}</td><td class="n">${fM1(z.p75)}</td><td class="n">${z.nN?fM1(z.nuevo):'—'}</td><td class="n">${z.nN?pct(z.nuevo/z.p50-1):'—'}</td></tr>`).join('')}</tbody></table>`;
    return {svg:stSvg(W,H,g), take, tabla};
  })();

  // 2 · $/m² según tamaño
  const c2 = (()=>{
    const W=540, H=300, L=48, B=30, T=8, R=10;
    const nv = D.nuevos.flatMap(x=>x.tipos.map(t=>({...t, p:x.p})));
    const xs=[...D.el.map(u=>u.ap),...nv.map(t=>t.area)], ys=[...D.el.map(u=>u.m2),...nv.map(t=>t.m2)];
    const paso = micro?2:10;
    const x0=Math.floor(stQ(xs,.01)/paso)*paso, x1=Math.ceil(stQ(xs,.99)/paso)*paso;
    const y0=Math.floor(stQ(ys,.01)/1e6)*1e6, y1=Math.ceil(stQ(ys,.99)/1e6)*1e6;
    const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
    const x=v=>L+(cl(v,x0,x1)-x0)/(x1-x0)*(W-L-R), y=v=>T+(1-(cl(v,y0,y1)-y0)/(y1-y0))*(H-T-B);
    const py=(y1-y0)>8e6?2e6:1e6;
    let g='';
    for(let t=y0;t<=y1;t+=py) g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--st-grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t/1e6} M</text>`;
    for(let t=x0;t<=x1;t+=paso) g+=`<text x="${x(t)}" y="${H-10}" text-anchor="middle">${t} m²</text>`;
    D.el.forEach(u=>g+=`<circle cx="${x(u.ap)}" cy="${y(u.m2)}" r="4" fill="var(--st-used)" fill-opacity=".45" data-tip="${stEsc(`<b>Usado · ${Z[u.zona].nombre}</b>${u.ap.toFixed(0)} m² priv. · ${fM(u.precio)} · ${fM1(u.m2)}/m²`)}" data-u="${u.id}"/>`);
    nv.forEach(t=>g+=`<circle cx="${x(t.area)}" cy="${y(t.m2)}" r="4.5" fill="var(--st-new)" stroke="var(--panel)" stroke-width="2" data-tip="${stEsc(`<b>${t.p.nombre}</b>${t.area.toFixed(1)} m² priv. · ${fM1(t.m2)}/m² (lista)`)}"/>`);
    const curva=(arr,ax,col)=>{ const pts=[]; for(let a=x0;a<x1;a+=paso){ const s=arr.filter(d=>ax(d)>=a&&ax(d)<a+paso); if(s.length>=3) pts.push([x(a+paso/2),y(median(s.map(d=>d.m2)))]); }
      return pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`:''; };
    g+=curva(D.el,u=>u.ap,'var(--st-used)')+curva(nv,t=>t.area,'var(--st-new)');
    const cortes = micro?[20,25]:[40,60];
    const ch=D.el.filter(u=>u.ap<cortes[0]), gr=D.el.filter(u=>u.ap>=cortes[1]);
    const take = ch.length>=5 && gr.length>=5
      ? `Un usado de menos de ${cortes[0]} m² privados cuesta <b>${pct(median(ch.map(u=>u.m2))/median(gr.map(u=>u.m2))-1)} por m²</b> frente a uno de ${cortes[1]} m² o más (medianas, n=${ch.length} y ${gr.length}). Por eso comparar con unidades más grandes infla el sobreprecio de un proyecto pequeño.`
      : 'Pocos anuncios en los extremos de tamaño para comparar.';
    return {svg:stSvg(W,H,g), take};
  })();

  // 3 · rebajas observadas vs. supuesto de negociación
  const c3 = (()=>{
    const r = reb.map(u=>u.rebaja*100);
    if(r.length<5) return {svg:`<div class="empty">Todavía hay muy pocas rebajas registradas (${r.length}). El historial de precios se llena con las corridas diarias.</div>`, take:''};
    const W=540, H=250, L=36, B=30, T=14, R=10, bins=[0,2,4,6,8,10,12,14,100], bw=(W-L-R)/(bins.length-1);
    const cnt=bins.slice(0,-1).map((b,i)=>r.filter(v=>v>=b&&v<bins[i+1]).length), mx=Math.max(...cnt,1);
    const xv=v=>{ const i=Math.max(0,bins.findIndex((b,k)=>v>=b&&v<bins[k+1])); return L+i*bw+Math.min(1,(v-bins[i])/(bins[i+1]-bins[i]))*bw; };
    const y=v=>T+(1-v/mx)*(H-T-B);
    let g='';
    [0,.5,1].forEach(f=>{ const v=Math.round(mx*f); g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--st-grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
    cnt.forEach((c,i)=>{ const lbl=i===cnt.length-1?`${bins[i]} % o más`:`${bins[i]}–${bins[i+1]} %`;
      g+=`<g data-tip="${stEsc(`<b>Rebaja ${lbl}</b>${c} anuncios (${stP(c/r.length)})`)}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>
        ${c?`<path d="${stBar(L+i*bw+1,y(c),bw-2,y(0))}" fill="var(--st-used)"/>`:''}</g>
        <text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${i===cnt.length-1?bins[i]+'+':bins[i]+'–'+bins[i+1]} %</text>`; });
    const m=median(r), sup=PARAMS.desc_neg*100;
    g+=`<line x1="${xv(sup)}" x2="${xv(sup)}" y1="${T-6}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${xv(sup)+5}" y="${T+2}" class="ink">supuesto ${sup.toLocaleString('es-CO')} %</text>`;
    g+=`<line x1="${xv(m)}" x2="${xv(m)}" y1="${T+12}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5"/><rect x="${xv(m)+4}" y="${H-B-24}" width="96" height="18" rx="4" fill="var(--panel)"/><text x="${xv(m)+8}" y="${H-B-11}" class="ink">mediana ${m.toLocaleString('es-CO',{maximumFractionDigits:1})} %</text>`;
    const sobre=r.filter(v=>v>=sup).length/r.length;
    return {svg:stSvg(W,H,g), take:`<b>${stP(r.length/D.el.length)}</b> de los anuncios bajó precio desde que lo vemos (seguimiento mediano: ${seguimiento} días) y la rebaja mediana fue <b>${m.toLocaleString('es-CO',{maximumFractionDigits:1})} %</b>; ${stP(sobre)} rebajó ${sup.toLocaleString('es-CO')} % o más. Es rebaja publicada, no precio de cierre (que suele ser menor): si la mediana queda lejos del supuesto, ajústalo en Supuestos.`};
  })();

  // 4 · administración por m² según antigüedad
  const c4 = (()=>{
    const v=TRAMOS.map(([t])=>{ const s=D.el.filter(u=>u.tramo===t && u.adm2); return {t, m:median(s.map(u=>u.adm2)), n:s.length}; });
    const ok=v.filter(d=>d.n>=3);
    if(ok.length<2) return {svg:'<div class="empty">Pocos anuncios con administración y antigüedad.</div>', take:''};
    const W=540, H=230, L=64, B=30, T=18, R=10, mx=Math.ceil(Math.max(...ok.map(d=>d.m))/2000)*2000, bw=(W-L-R)/v.length;
    const y=val=>T+(1-val/mx)*(H-T-B);
    let g='';
    for(let t=0;t<=mx;t+=2000) g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--st-grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${stPesos(t)}</text>`;
    v.forEach((d,i)=>{ g+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${d.t} años</text>`;
      if(d.n<3) return; const x0=L+i*bw+bw*.22, w=bw*.56;
      g+=`<g data-tip="${stEsc(`<b>Edificio ${d.t} años</b>Admin mediana ${stPesos(d.m)}/m² al mes (n=${d.n})<br>Apto de 40 m²: ${stPesos(d.m*40)} al mes`)}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>
        <path d="${stBar(x0,y(d.m),w,y(0))}" fill="var(--st-used)"/><text x="${x0+w/2}" y="${y(d.m)-6}" text-anchor="middle" class="ink">${stPesos(d.m)}</text></g>`; });
    const a=ok[0], b=ok.at(-1);
    return {svg:stSvg(W,H,g), take:`Edificio de ${a.t} años: <b>${stPesos(a.m)}/m²</b> al mes; de ${b.t} años: <b>${stPesos(b.m)}/m²</b> (${pct(a.m/b.m-1)}). En 40 m² la diferencia es ${fM1((a.m-b.m)*40*12)} al año, que sale directo de la renta neta.`};
  })();

  // 5 · oferta que pasa tus reglas
  const c5 = (()=>{
    const zs=[...Z0].sort((a,b)=>b.total-a.total), W=540, L=200, R=64, row=22, H=zs.length*row+8, mx=Math.max(1,...zs.map(z=>z.total));
    const x=v=>L+v/mx*(W-L-R);
    let g='';
    zs.forEach((z,i)=>{ const y=4+i*row, w1=x(z.n)-L, w2=x(z.total)-x(z.n);
      g+=`<g data-tip="${stEsc(`<b>${z.z.nombre}</b>${z.total} usados vigentes · ${z.n} cumplen (${stP(z.total?z.n/z.total:0)})`)}"><rect x="0" y="${y}" width="${W}" height="${row}" fill="transparent"/>
        <text x="0" y="${y+14}" class="ink">${z.z.nombre}</text>
        ${z.n?`<rect x="${L}" y="${y+5}" width="${Math.max(w1-1,2)}" height="12" rx="3" fill="var(--st-used)"/>`:''}
        ${w2>1?`<rect x="${L+w1+1}" y="${y+5}" width="${w2-1}" height="12" rx="3" fill="var(--st-rest)"/>`:''}
        <text x="${x(z.total)+6}" y="${y+14}">${z.n} / ${z.total}</text></g>`; });
    const pocos=Z0.filter(z=>z.n<ST_MIN_N).map(z=>z.z.nombre);
    return {svg:stSvg(W,H,g), take: pocos.length ? `Con menos de ${ST_MIN_N} usados que cumplen: <b>${pocos.join(', ')}</b>. Ahí las medianas son poco confiables y los proyectos suelen quedar sin comparables (s/c).` : `Todas las zonas tienen al menos ${ST_MIN_N} usados que cumplen.`};
  })();

  // 6 · oportunidades: usados bajo la mediana de su zona
  const medZ={}; Z0.forEach(z=>{ if(z.n>=ST_MIN_N) medZ[z.z.id]=z; });
  const oport = D.el.filter(u=>medZ[u.zona]).map(u=>{ const z=medZ[u.zona], zz=Z[u.zona];
    const yN = ((zz.arriendo_m2*u.ap-(u.admin||0))*12)/u.precio - PARAMS.predial;
    return {...u, desv:u.m2/z.p50-1, yN}; }).filter(u=>u.desv<=ST_OPORT).sort((a,b)=>a.desv-b.desv).slice(0,12);

  // 7 · parámetros por zona
  const SRC = {m:'<span class="st-src m">medido</span>', s:'<span class="st-src s">supuesto</span>', d:'<span class="st-src d">derivado</span>'};
  const filas = [...Z0].sort((a,b)=>(b.p50||0)-(a.p50||0)).map(z=>{ const ok=z.n>=ST_MIN_N, pc='<small>pocos datos</small>', zz=z.z;
    return `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${zz.color}"></i> ${zz.nombre}</td><td class="n">${z.n}</td>
      <td class="n">${z.estrato??'—'}</td><td class="n">${ok?fM1(z.p50):pc}</td><td class="n">${ok?stPesos(z.adm2):'—'}</td>
      <td class="n">${ok?Math.round(z.dias)+' d':'—'}</td><td class="n">${ok?stP(z.conRebaja):'—'}</td>
      <td class="n">${fK(zz.arriendo_m2)}</td><td class="n">${fK(zz.adr[1]*(micro?PARAMS.adr_micro:1))}</td><td class="n">${stP(zz.ocup)}</td>
      <td class="n">${ok?stP(z.yB,1):'—'}</td><td class="n">${ok?stP(z.yN,1):'—'}</td></tr>`; }).join('');

  el.innerHTML = `<div class="page"><h2>Estadísticas · ${D.ciudad}</h2>
  <p class="muted">Lo que dicen los anuncios recolectados: usados vigentes que cumplen tus reglas (ascensor, ≤ ${fM(PARAMS.precio_max)}; sin unidades de proyecto ni duplicados) y tipologías de proyectos nuevos en zona. Segmento ${micro?'Micro · &lt; 30 m²':'Estándar · ≥ 30 m²'}. Se recalcula con cada corrida.</p>
  <div class="toolbar"><div class="seg" style="margin-left:0">${['Bogotá','Bucaramanga'].map(c=>`<button data-stc="${c}" class="${state.ciudad===c?'on':''}">${c}</button>`).join('')}</div></div>
  <div class="st-kpis">${kpis.map(k=>`<div class="st-kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="st-grid">
   <div class="card wide"><button class="st-tbtn" id="st-tbtn">${ST_TABLA?'Ocultar tabla':'Ver tabla'}</button>
    <h4>¿Cuánto cuesta el m² en cada zona, y cuánto más cobra lo nuevo?</h4>
    <p class="st-q">Barra = mitad central de los usados (percentil 25 a 75). Punto = mediana de usados. Rombo = mediana de proyectos nuevos (precio de lista). A la derecha, la prima de lo nuevo. Barra punteada = menos de ${ST_MIN_N} anuncios.</p>
    <div class="st-leg"><span><i class="bar" style="background:var(--st-used-soft);outline:1px solid var(--st-used)"></i>Usados: rango central</span><span><i style="background:var(--st-used)"></i>Usados: mediana</span><span><i class="dia" style="background:var(--st-new)"></i>Nuevos: mediana</span></div>
    ${c1.svg}<div class="ctab" style="display:${ST_TABLA?'block':'none'};margin-top:8px">${c1.tabla}</div>${c1.take?`<div class="st-take">${c1.take}</div>`:''}</div>
   <div class="card"><h4>Entre más chica la unidad, más caro el m²</h4><p class="st-q">Cada punto es un anuncio. Líneas = mediana por rango de tamaño (área privada).</p>
    <div class="st-leg"><span><i style="background:var(--st-used)"></i>Usados</span><span><i style="background:var(--st-new)"></i>Nuevos</span></div>${c2.svg}<div class="st-take">${c2.take}</div></div>
   <div class="card"><h4>¿El ${(PARAMS.desc_neg*100).toLocaleString('es-CO')} % de negociación es realista?</h4><p class="st-q">Usados que bajaron de precio mientras los seguíamos, por tamaño de la rebaja.</p>
    <div class="st-leg"><span><i class="bar" style="background:var(--st-used)"></i>Anuncios</span><span style="color:var(--ink)">┆ supuesto actual</span></div>${c3.svg}${c3.take?`<div class="st-take">${c3.take}</div>`:''}</div>
   <div class="card"><h4>Administración por m² según la edad del edificio</h4><p class="st-q">Mediana de administración mensual por m² privado.</p>${c4.svg}${c4.take?`<div class="st-take">${c4.take}</div>`:''}</div>
   <div class="card"><h4>¿Cuánta oferta pasa tus reglas?</h4><p class="st-q">Usados vigentes por zona: los que cumplen frente al resto.</p>
    <div class="st-leg"><span><i class="bar" style="background:var(--st-used)"></i>Cumplen</span><span><i class="bar" style="background:var(--st-rest)"></i>No cumplen</span></div>${c5.svg}<div class="st-take">${c5.take}</div></div>
   <div class="card wide"><h4>Oportunidades: usados ≥ ${Math.abs(ST_OPORT*100)} % bajo la mediana de su zona</h4>
    <p class="st-q">Solo zonas con al menos ${ST_MIN_N} anuncios que cumplen. Un precio bajo puede tener razón (piso bajo, interior, para remodelar): es una lista para revisar, no para comprar. Clic en una fila para verla en el mapa.</p>
    ${oport.length?`<div class="ctab"><table class="st-tbl"><thead><tr><th>Zona</th><th>Barrio</th><th>Tipo</th><th class="n">Á. priv</th><th class="n">Precio</th><th class="n">$/m²</th><th class="n">vs. zona</th><th class="n">Admin</th><th>Antig.</th><th class="n">Publicado</th><th class="n">Δ precio</th><th class="n">Rentab. neta est.</th></tr></thead><tbody>${
      oport.map(u=>`<tr class="op" data-op="${u.id}"><td>${Z[u.zona].nombre}</td><td>${u.barrio||'—'}</td><td>${nombreUsado(u)}</td><td class="n">${u.ap.toFixed(0)} m²</td><td class="n">${fM(u.precio)}</td><td class="n">${fM1(u.m2)}</td><td class="n neg">${pct(u.desv)}</td><td class="n">${fK(u.admin)}</td><td>${antig(u)}</td><td class="n">${u.dias} d</td><td class="n">${u.rebaja?'−'+stP(u.rebaja,1):'—'}</td><td class="n">${stP(u.yN,1)}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12px">Rentabilidad neta estimada = (arriendo supuesto de la zona × área − administración) × 12 ÷ precio − predial. Indicativa mientras el arriendo sea supuesto.</p>`
     :'<div class="empty">Ningún usado está 10 % o más bajo la mediana de su zona.</div>'}</div>
   <div class="card wide"><h4>Parámetros por zona</h4>
    <p class="st-q">Cada columna dice de dónde sale: <span class="st-src m">medido</span> = calculado de los anuncios; <span class="st-src s">supuesto</span> = valor puesto a mano mientras no haya fuente; <span class="st-src d">derivado</span> = cuenta con los anteriores.</p>
    <div class="ctab"><table class="st-tbl"><thead><tr><th>Zona</th><th class="n">n</th><th class="n">Estrato<br>${SRC.m}</th><th class="n">Venta $/m²<br>${SRC.m}</th><th class="n">Admin/m²<br>${SRC.m}</th><th class="n">Días publ.<br>${SRC.m}</th><th class="n">Con rebaja<br>${SRC.m}</th><th class="n">Arriendo $/m²<br>${SRC.s}</th><th class="n">ADR ${micro?'micro':'1H'}<br>${SRC.s}</th><th class="n">Ocupación<br>${SRC.s}</th><th class="n">Rentab. bruta<br>${SRC.d}</th><th class="n">Rentab. neta<br>${SRC.d}</th></tr></thead><tbody>${filas}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin-bottom:0">Estrato = el más frecuente. Días publicado = mediana desde la fecha de publicación en el portal (liquidez: más días, más margen para negociar). Rentabilidad bruta = arriendo × 12 ÷ $/m²; neta = descontando administración y predial (${stP(PARAMS.predial,1)}). Hoy el arriendo es supuesto, así que las rentabilidades son indicativas; con el módulo de arriendos esa columna pasa a medida. ADR y ocupación de renta corta no tienen fuente gratuita: seguirán como supuestos.</p></div>
  </div></div>`;

  const tip=$('#st-tip');
  el.querySelectorAll('[data-tip]').forEach(n=>{ n.addEventListener('mousemove',e=>{ tip.innerHTML=n.dataset.tip; tip.style.opacity=1;
      tip.style.left=Math.min(e.clientX+14,innerWidth-290)+'px'; tip.style.top=(e.clientY+14)+'px'; });
    n.addEventListener('mouseleave',()=>tip.style.opacity=0); });
  el.querySelectorAll('[data-stc]').forEach(b=>b.onclick=()=>{ state.ciudad=b.dataset.stc; state.sel=null; renderAll(); fitCiudad(); });
  $('#st-tbtn').onclick=()=>{ ST_TABLA=!ST_TABLA; renderEst(); };
  el.querySelectorAll('[data-op]').forEach(r=>r.onclick=()=>{ tip.style.opacity=0; $('#tabs button[data-v="mapa"]').click(); selUsado(r.dataset.op); });
}

/* ---------- KPIs y orquestación ---------- */
function renderKPIs(){
  const ps=proyFiltrados(), pr=ps.map(primaProyecto).filter(x=>x!==null);
  const hoy=PROYECTOS.filter(p=>p.detectado===HOY).length+USADOS.filter(u=>u.detectado===HOY&&elegible(u)).length;
  $('#kpis').innerHTML=`<div class="kpi"><b>${ps.length}</b><span>Proyectos</span></div>
   <div class="kpi"><b>${usadosFiltrados().length}</b><span>Usados elegibles</span></div>
   <div class="kpi"><b>${pct(median(pr))}</b><span>Sobreprecio real med.</span></div>
   <div class="kpi"><b>${hoy}</b><span>Detectados hoy</span></div>`;
}
function renderAll(withSup=true){
  renderKPIs(); renderFiltros(); renderMapa(); renderDetalle(); renderTabla(); renderUsados(); renderFeed(); renderEst(); if(withSup) renderSup();
}
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='mapa') setTimeout(()=>map.invalidateSize(),50);
});
async function cargarDatos(){
  if(new URLSearchParams(location.search).has('demo') || location.protocol==='file:') return;
  try{
    const r = await fetch('../data/processed/dashboard.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    // solo las zonas que trae el dashboard (si se retira una zona del config, desaparece del mapa)
    const ids=new Set((d.zonas?.features||[]).map(f=>f.properties.id));
    if(ids.size){ for(let i=ZONAS.length-1;i>=0;i--) if(!ids.has(ZONAS[i].id)){ delete Z[ZONAS[i].id]; state.zonas.delete(ZONAS[i].id); ZONAS.splice(i,1); } }
    (d.zonas?.features||[]).forEach(f=>{ const z=Z[f.properties.id];
      if(z){ z.poly = f.geometry.coordinates[0].slice(0,-1).map(([lng,lat])=>[lat,lng]);
             if(f.properties.descripcion) z.desc = f.properties.descripcion; } });
    PROYECTOS = (d.proyectos||[]).filter(p=>Z[p.zona]).map(p=>({...p, ciudad:Z[p.zona].ciudad}));
    USADOS_TODOS = (d.usados||[]).filter(u=>!u.zona || Z[u.zona])
      .map(u=>({...u, ciudad: u.zona ? Z[u.zona].ciudad : (u.lat>6 ? 'Bucaramanga' : 'Bogotá')}));
    USADOS = USADOS_TODOS.filter(u=>u.zona);
    COMP_UT = USADOS_TODOS; COMP_U = USADOS;
    if(d.generado) HOY = d.generado.slice(0,10);
    PENDIENTES = {sin_ubicar:d.sin_ubicar||[], fuera:d.fuera_de_zonas||[]};
    GENERADO = d.generado; MODO = 'real';
    $('#modo').textContent = USADOS.length ? 'DATOS REALES' : 'DATOS REALES · USADOS PENDIENTES';
    $('#subtitulo').textContent = `≤ ${fM(PARAMS.precio_max)} · ${USADOS.length} usados · act. ${new Date(GENERADO).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}`;
  }catch(e){ console.warn('Sin dashboard.json: modo demo.', e); }
}
// Segmentos: cada pestaña ve solo sus tipologías y sus usados (Estándar ≥ 30 m² | Micro < 30 m² construidos).
// Un proyecto mixto (p. ej. Metro 73) aparece en las dos, cada vez con sus propias tipologías.
let TODOS_P = null, TODOS_U = null;
const segDe = x => x.segmento || 'estandar';
function aplicarSegmento(k){
  if(TODOS_P===null){ TODOS_P = PROYECTOS; TODOS_U = USADOS_TODOS; }
  state.seg = k; state.sel = null; state.selU = null; state.tip = 0;
  try{ localStorage.setItem('vivienda.seg', k); }catch(e){}
  PROYECTOS = TODOS_P.map(p=>({...p, tipologias:p.tipologias.filter(t=>segDe(t)===k)})).filter(p=>p.tipologias.length);
  USADOS_TODOS = TODOS_U.filter(u=>segDe(u)===k);
  USADOS = USADOS_TODOS.filter(u=>u.zona);
  COMP_UT = TODOS_U; COMP_U = TODOS_U.filter(u=>u.zona);
  document.body.classList.toggle('micro', k==='micro');
  $('#seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===k));
  if(MODO==='real' && GENERADO) $('#subtitulo').textContent =
    `${k==='micro'?'Micro < 30 m²':'≤ '+fM(PARAMS.precio_max)} · ${USADOS.length} usados · act. ${new Date(GENERADO).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}`;
}
$('#seg').addEventListener('click', e=>{ const b=e.target.closest('button[data-s]'); if(!b || b.dataset.s===state.seg) return;
  aplicarSegmento(b.dataset.s); renderAll(); });
cargarDatos().then(()=>{ aplicarSegmento(state.seg); dibujarZonas(); renderAll(); fitCiudad(); });
</script>
